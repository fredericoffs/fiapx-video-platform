name: CI - video-worker

on:
  push:
    branches: [ main, develop ]
    paths:
      - "video-worker/**"
      - ".github/workflows/ci-video-worker.yml"
  pull_request:
    paths:
      - "video-worker/**"
      - ".github/workflows/ci-video-worker.yml"

defaults:
  run:
    working-directory: video-worker

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Build and test
        run: ./mvnw -B verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-worker-test-reports
          path: video-worker/target/surefire-reports/
          retention-days: 7

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-worker-coverage-report
          path: video-worker/target/site/jacoco/
          retention-days: 7

      # Cache da base NVD compartilhado pelos 4 serviços (mesma key em todos os workflows,
      # path definido via dataDirectory no pom.xml) — sem isso, cada job re-sincroniza a
      # base inteira do zero (runner efêmero), o que é lento mesmo com NVD_API_KEY. Key por
      # hora: a base muda com o tempo independente do pom; restore-keys busca a cópia mais
      # recente disponível para sync incremental em vez de do zero.
      - name: Get date for Dependency-Check cache key
        id: get-date
        run: echo "datetime=$(/bin/date -u "+%Y%m%d%H")" >> "$GITHUB_OUTPUT"

      - name: Restore Dependency-Check NVD cache
        uses: actions/cache/restore@v4
        with:
          path: .dependency-check-data
          key: dependency-check-nvd-${{ steps.get-date.outputs.datetime }}
          restore-keys: |
            dependency-check-nvd-

      - name: OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./mvnw -B dependency-check:check

      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-worker-dependency-check-report
          path: video-worker/target/dependency-check-report.html
          retention-days: 7

      - name: Build Docker image
        run: docker build -t video-worker:ci .

      # trivy-action pinned by commit SHA (not a tag): tags 0.0.1-0.34.2 were compromised in a
      # 2026-03 supply-chain attack (GHSA-69fq-xp46-6x23). SHA below is the v0.36.0 tag, released
      # after the fix. trivy-version is pinned explicitly for the same reason (avoid the
      # compromised trivy CLI v0.69.4 / DockerHub v0.69.5-v0.69.6 window from the same incident).
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: video-worker:ci
          trivy-version: v0.74.0
          format: sarif
          output: video-worker/trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-worker-trivy-report
          path: video-worker/trivy-results.sarif
          retention-days: 7

      # if: always() garante que a base fica salva mesmo se um passo depois do
      # Dependency-Check (build/scan da imagem, Trivy) falhar.
      - name: Save Dependency-Check NVD cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .dependency-check-data
          key: dependency-check-nvd-${{ steps.get-date.outputs.datetime }}
