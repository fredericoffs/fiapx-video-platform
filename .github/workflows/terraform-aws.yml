name: Terraform - AWS EKS

# Provisiona (ou destrói) VPC + EKS + ECR + RDS + ElastiCache + SQS + S3 na conta AWS, à mão.
# O cd-aws.yml já faz plan/apply automaticamente antes do deploy; este workflow serve pra
# revisar um plan, forçar um apply isolado ou destruir só o Terraform. As credenciais
# (chave de um usuário IAM) ficam no GitHub Environment "AWS": AWS_ACCESS_KEY_ID e AWS_SECRET_ACCESS_KEY.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "Ação do Terraform"
        required: true
        type: choice
        options: [ plan, apply, destroy ]
        default: plan

permissions:
  contents: read

concurrency:
  group: fiapx-aws-lifecycle
  cancel-in-progress: false

jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: AWS
    env:
      AWS_REGION: us-east-1
      # Opcionais: preenchidos usam o valor do GitHub; vazios são gerados e publicados no SSM.
      TF_VAR_db_password: ${{ secrets.PROD_DB_PASSWORD }}
      TF_VAR_jwt_secret: ${{ secrets.PROD_JWT_SECRET }}
      TF_VAR_admin_password: ${{ secrets.PROD_ADMIN_PASSWORD }}
      TF_VAR_notification_webhook_url: ${{ secrets.PROD_NOTIFICATION_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform plan
        if: inputs.action == 'plan'
        run: ./scripts/aws-up.sh --region "$AWS_REGION" --plan-only

      - name: terraform apply
        if: inputs.action == 'apply'
        run: ./scripts/aws-up.sh --region "$AWS_REGION" --auto-approve

      - name: terraform destroy
        if: inputs.action == 'destroy'
        run: |
          ./scripts/aws-tf-init.sh k8s/terraform/aws
          terraform -chdir=k8s/terraform/aws destroy -input=false -auto-approve
