name: Qodana (manual)

# Análise estática JetBrains Qodana — só sob demanda (workflow_dispatch), fora da
# esteira de CI de cada push. Linter Community (gratuito, roda sem QODANA_TOKEN):
# a licença Ultimate venceu, e o qodana-js só existe pago — o web fica com o ESLint
# (--max-warnings=0) do ci.yml.
on:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  qodana-jvm:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: JetBrains/qodana-action@v2026.2
        with:
          pr-mode: false
          use-caches: true
          post-pr-comment: false
          use-annotations: true
          upload-result: true
          push-fixes: 'none'
