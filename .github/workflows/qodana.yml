name: Qodana (manual)

# Análise estática JetBrains Qodana — só sob demanda (workflow_dispatch), fora da
# esteira de CI de cada push. Dois projetos Qodana Cloud: JVM (raiz) e web.
on:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  qodana-jvm:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"
      # `test`, não `verify`: só preciso do jacoco.xml pro Qodana ler cobertura;
      # o gate de 90% já roda no ci.yml.
      - name: Gerar relatórios de cobertura (JaCoCo)
        run: |
          set -e
          for service in video-api video-worker notification-worker video-gateway; do
            (cd "$service" && ./mvnw -B test)
          done
      - uses: JetBrains/qodana-action@v2026.2
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
        with:
          pr-mode: false
          use-caches: true
          post-pr-comment: false
          use-annotations: true
          upload-result: true
          push-fixes: 'none'

  qodana-web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Gerar relatório de cobertura (lcov)
        working-directory: web
        run: npm run test:coverage
      - uses: JetBrains/qodana-action@v2026.2
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_WEB }}
        with:
          args: '-i web'
          pr-mode: false
          use-caches: true
          post-pr-comment: false
          use-annotations: true
          upload-result: true
          push-fixes: 'none'
