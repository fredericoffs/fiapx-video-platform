name: CD - Oracle

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [video-gateway, video-api, video-worker, notification-worker, web]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ secrets.PROD_API_BASE_URL }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/fiapx-${{ matrix.service }}:latest
            ghcr.io/${{ github.repository_owner }}/fiapx-${{ matrix.service }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Instalar kubectl, kustomize e helm
        run: |
          KUBECTL_VERSION="$(curl -Ls https://dl.k8s.io/release/stable.txt)"
          curl -LO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/kubectl

          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/kustomize

          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Instalar OCI CLI
        run: pip install --quiet oci-cli

      - name: Gerar kubeconfig do cluster OKE
        env:
          OCI_CLI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_CLI_USER: ${{ secrets.OCI_USER_OCID }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_CLI_REGION: ${{ secrets.OCI_REGION }}
        run: |
          mkdir -p "$HOME/.kube"
          CLUSTER_ID="$(oci ce cluster list \
            --compartment-id '${{ secrets.OCI_COMPARTMENT_OCID }}' \
            --name fiapx --lifecycle-state ACTIVE \
            --query 'data[0].id' --raw-output)"
          oci ce cluster create-kubeconfig \
            --cluster-id "$CLUSTER_ID" \
            --file "$HOME/.kube/config" \
            --region "${OCI_CLI_REGION}" \
            --token-version 2.0.0

      - name: Deploy no cluster
        env:
          GHCR_OWNER: ${{ github.repository_owner }}
          IMAGE_TAG: ${{ github.sha }}
          DB_USER: ${{ secrets.PROD_DB_USER }}
          DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          RABBITMQ_USER: ${{ secrets.PROD_RABBITMQ_USER }}
          RABBITMQ_PASSWORD: ${{ secrets.PROD_RABBITMQ_PASSWORD }}
          STORAGE_ACCESS_KEY: ${{ secrets.PROD_STORAGE_ACCESS_KEY }}
          STORAGE_SECRET_KEY: ${{ secrets.PROD_STORAGE_SECRET_KEY }}
          JWT_SECRET: ${{ secrets.PROD_JWT_SECRET }}
        run: ./scripts/k8s-deploy-oracle.sh
