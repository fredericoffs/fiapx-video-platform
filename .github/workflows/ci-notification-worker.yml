name: CI - notification-worker

on:
  push:
    branches: [main, develop]
    paths:
      - "notification-worker/**"
      - ".github/workflows/ci-notification-worker.yml"
  pull_request:
    paths:
      - "notification-worker/**"
      - ".github/workflows/ci-notification-worker.yml"

defaults:
  run:
    working-directory: notification-worker

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Build and test
        run: ./mvnw -B verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notification-worker-test-reports
          path: notification-worker/target/surefire-reports/
          retention-days: 7
