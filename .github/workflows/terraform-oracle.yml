name: Terraform - Oracle OKE

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Ação do Terraform"
        required: true
        type: choice
        options: [ plan, apply, destroy ]
        default: plan

jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Oracle Cloud
    defaults:
      run:
        working-directory: k8s/terraform/oracle
    env:
      TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
      TF_VAR_user_ocid: ${{ secrets.OCI_USER_OCID }}
      TF_VAR_fingerprint: ${{ secrets.OCI_FINGERPRINT }}
      TF_VAR_private_key_pem: ${{ secrets.OCI_PRIVATE_KEY }}
      TF_VAR_region: ${{ secrets.OCI_REGION }}
      TF_VAR_compartment_ocid: ${{ secrets.OCI_COMPARTMENT_OCID }}
      TF_VAR_ssh_public_key: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
      OCI_REGION: ${{ secrets.OCI_REGION }}
      OCI_OS_NAMESPACE: ${{ secrets.OCI_OS_NAMESPACE }}
      OCI_S3_ACCESS_KEY_ID: ${{ secrets.OCI_S3_ACCESS_KEY_ID }}
      OCI_S3_SECRET_ACCESS_KEY: ${{ secrets.OCI_S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      # Requer bootstrap-oracle-backend.yml executado antes (cria bucket/secrets).
      - name: terraform init (backend remoto)
        run: |
          chmod +x ../../../scripts/oracle-tf-init.sh
          ../../../scripts/oracle-tf-init.sh "$(pwd)"

      - name: terraform plan
        run: terraform plan -out=tfplan

      - name: terraform apply
        if: inputs.action == 'apply'
        run: terraform apply -auto-approve tfplan

      - name: terraform destroy
        if: inputs.action == 'destroy'
        run: terraform destroy -auto-approve
