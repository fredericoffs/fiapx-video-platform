name: Bootstrap Oracle Terraform Backend

# Roda UMA VEZ (workflow_dispatch manual): cria o bucket de state remoto no Object
# Storage e uma Customer Secret Key pra autenticar nele via API S3-compatible.
# Depois de rodar, copie os 3 valores do Summary deste job para os secrets do
# repositorio (Settings -> Secrets and variables -> Actions):
#   OCI_OS_NAMESPACE, OCI_S3_ACCESS_KEY_ID, OCI_S3_SECRET_ACCESS_KEY
# A partir dai, terraform-oracle.yml e destroy-oracle.yml usam esses secrets pra
# inicializar o backend remoto (scripts/oracle-tf-init.sh) e nao rodar mais isso de novo.
on:
  workflow_dispatch:

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Oracle Cloud
    env:
      OCI_CLI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_CLI_USER: ${{ secrets.OCI_USER_OCID }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_PRIVATE_KEY }}
      OCI_CLI_REGION: ${{ secrets.OCI_REGION }}
    steps:
      - name: Instalar OCI CLI
        run: pip install --quiet oci-cli

      - name: Obter namespace do Object Storage
        id: ns
        run: |
          NS="$(oci os ns get --query data --raw-output)"
          echo "namespace=$NS" >> "$GITHUB_OUTPUT"

      - name: Criar bucket de state (se ainda nao existir)
        run: |
          if oci os bucket get --namespace-name "${{ steps.ns.outputs.namespace }}" --bucket-name fiapx-terraform-state >/dev/null 2>&1; then
            echo "bucket fiapx-terraform-state ja existe"
          else
            oci os bucket create \
              --compartment-id "${{ secrets.OCI_COMPARTMENT_OCID }}" \
              --namespace-name "${{ steps.ns.outputs.namespace }}" \
              --name fiapx-terraform-state
          fi

      - name: Gerar Customer Secret Key
        id: key
        run: |
          RESULT="$(oci iam customer-secret-key create \
            --user-id "${{ secrets.OCI_USER_OCID }}" \
            --display-name fiapx-terraform-backend \
            --query data --output json)"
          echo "access_key=$(echo "$RESULT" | jq -r '.id')" >> "$GITHUB_OUTPUT"
          echo "secret_key=$(echo "$RESULT" | jq -r '.key')" >> "$GITHUB_OUTPUT"

      - name: Resumo — copie estes valores para os secrets do repositorio
        run: |
          {
            echo "## Backend remoto criado — copie para Settings > Secrets and variables > Actions"
            echo
            echo "| Secret | Valor |"
            echo "|---|---|"
            echo "| \`OCI_OS_NAMESPACE\` | \`${{ steps.ns.outputs.namespace }}\` |"
            echo "| \`OCI_S3_ACCESS_KEY_ID\` | \`${{ steps.key.outputs.access_key }}\` |"
            echo "| \`OCI_S3_SECRET_ACCESS_KEY\` | \`${{ steps.key.outputs.secret_key }}\` |"
            echo
            echo "**Esta e a UNICA vez que o secret key aparece — a Oracle nao permite recuperar depois.**"
            echo "Se perder antes de copiar: delete a Customer Secret Key em Identity > Users > (seu usuario) >"
            echo "Customer Secret Keys (\`fiapx-terraform-backend\`) e rode este workflow de novo."
            echo
            echo "Depois de cadastrar os 3 secrets, rode \`Terraform - Oracle OKE\` (action: plan) normalmente —"
            echo "o backend remoto entra em uso automaticamente."
          } >> "$GITHUB_STEP_SUMMARY"
