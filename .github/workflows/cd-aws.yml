name: CD - AWS EKS

# Provisiona a infra se precisar (terraform plan; apply só quando há mudanças — com
# tudo no ar é um no-op de ~2 min), builda as 5 imagens, publica no ECR e faz o deploy
# no EKS com o perfil aws (RDS, ElastiCache, SQS, S3). Requer os secrets
# AWS_ACCESS_KEY_ID e AWS_SECRET_ACCESS_KEY (usuário IAM) no Environment AWS. terraform-aws.yml continua disponível pra rodar
# plan/apply/destroy à mão; todos os workflows AWS compartilham o grupo fiapx-aws-lifecycle.
on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      provision:
        description: "Infra: auto (plan e apply se houver mudanças) ou skip (só build e deploy)"
        required: false
        type: choice
        options: [ auto, skip ]
        default: auto

permissions:
  contents: read

concurrency:
  group: fiapx-aws-lifecycle
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  CLUSTER_NAME: fiapx

jobs:
  # Tanto push quanto dispatch exigem CI aprovado para o mesmo commit.
  wait-for-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: read
    steps:
      - name: Espera o workflow CI concluir pra este commit e falha se não passou
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Aguardando conclusão do CI para ${{ github.sha }}..."
          for _ in $(seq 1 90); do
            run_json=$(gh run list --repo "${{ github.repository }}" --workflow=ci.yml \
              --commit "${{ github.sha }}" --json status,conclusion --jq '.[0] // empty')
            if [ -z "$run_json" ]; then
              echo "Nenhuma execução de CI encontrada ainda pra este commit, tentando de novo em 20s..."
              sleep 20
              continue
            fi
            run_status=$(echo "$run_json" | jq -r '.status')
            if [ "$run_status" != "completed" ]; then
              echo "CI ainda em '$run_status', aguardando 20s..."
              sleep 20
              continue
            fi
            conclusion=$(echo "$run_json" | jq -r '.conclusion')
            if [ "$conclusion" = "success" ]; then
              echo "CI passou (conclusion=$conclusion)."
              exit 0
            fi
            echo "CI concluiu como '$conclusion' — não implanto um commit sem CI verde."
            exit 1
          done
          echo "Tempo esgotado esperando o CI concluir pra este commit."
          exit 1

  provision:
    needs: wait-for-ci
    # Skip dispensa apenas provisionamento; nunca dispensa a validação do commit.
    if: |
      always() &&
      needs.wait-for-ci.result == 'success' &&
      inputs.provision != 'skip'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: AWS
    env:
      # Opcionais: se o secret existir no GitHub o Terraform usa esse valor; vazio → gera e
      # publica no SSM (/fiapx/...). O job deploy lê tudo do SSM.
      TF_VAR_db_password: ${{ secrets.PROD_DB_PASSWORD }}
      TF_VAR_jwt_secret: ${{ secrets.PROD_JWT_SECRET }}
      TF_VAR_admin_password: ${{ secrets.PROD_ADMIN_PASSWORD }}
      TF_VAR_notification_webhook_url: ${{ secrets.PROD_NOTIFICATION_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform plan (+ apply se houver mudanças)
        run: ./scripts/aws-up.sh --region "$AWS_REGION" --apply-if-changed

  build-and-push:
    needs: [ wait-for-ci, provision ]
    # provision pode ter sido pulado por dois motivos: "provision: skip" (intencional, segue
    # normalmente) ou porque wait-for-ci barrou o job (CI vermelho/expirado) — nesse segundo
    # caso não pode seguir, senão o gate do item 18 vira decoração.
    if: |
      always() &&
      needs.wait-for-ci.result == 'success' &&
      !cancelled() && needs.provision.result != 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: AWS
    outputs:
      ecr_registry: ${{ steps.ecr.outputs.registry }}
    strategy:
      matrix:
        service: [video-gateway, video-api, video-worker, notification-worker, web]
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/fiapx/${{ matrix.service }}:latest
            ${{ steps.ecr.outputs.registry }}/fiapx/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  deploy:
    needs: [ provision, build-and-push ]
    if: ${{ !cancelled() && needs.build-and-push.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: AWS
    steps:
      - uses: actions/checkout@v7

      - name: Instalar kubectl, kustomize e helm
        run: |
          KUBECTL_VERSION="$(curl -Ls https://dl.k8s.io/release/stable.txt)"
          curl -LO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/kubectl

          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/kustomize

          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Gerar kubeconfig do cluster EKS
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$CLUSTER_NAME"

      - name: Deploy no cluster
        env:
          ECR_REGISTRY: ${{ needs.build-and-push.outputs.ecr_registry }}
          IMAGE_TAG: ${{ github.sha }}
          ALERTMANAGER_WEBHOOK_URL: ${{ secrets.PROD_ALERTMANAGER_WEBHOOK_URL }}
          SMTP_HOST: ${{ vars.PROD_SMTP_HOST }}
          SMTP_USER: ${{ secrets.PROD_SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.PROD_SMTP_PASSWORD }}
          NOTIFICATION_FROM: ${{ vars.PROD_NOTIFICATION_FROM }}
          # DB_USER/DB_PASSWORD/JWT_SECRET/NOTIFICATION_WEBHOOK_URL vêm do SSM (/fiapx/...).
        run: ./scripts/k8s-deploy-aws.sh

      # Rollout pronto não prova o fluxo de negócio: cadastro, upload real, ffmpeg, download
      # e conferência do zip, mais o caminho de falha até a notificação — tudo pela URL pública.
      - name: Teste E2E contra o ambiente implantado
        env:
          # Destinatário da notificação de falha vira plus-address desta conta; as mesmas
          # credenciais do SMTP abrem a INBOX por IMAP pra provar que o e-mail chegou.
          NOTIFICATION_FROM: ${{ vars.PROD_NOTIFICATION_FROM }}
          SMTP_HOST: ${{ vars.PROD_SMTP_HOST }}
          SMTP_USER: ${{ secrets.PROD_SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.PROD_SMTP_PASSWORD }}
        run: ./scripts/aws-e2e-smoke.sh
