name: CD - AWS EKS

# Provisiona a infra se precisar (terraform plan; apply só quando há mudanças — com
# tudo no ar é um no-op de ~2 min), builda as 5 imagens, publica no ECR e faz o deploy
# no EKS com o perfil aws (RDS, ElastiCache, SQS, S3). Requer sessão do Learner Lab
# ativa (secrets AWS_* renovados). terraform-aws.yml continua disponível pra rodar
# plan/apply/destroy à mão; os três workflows compartilham o grupo terraform-aws.
on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      provision:
        description: "Infra: auto (plan e apply se houver mudanças) ou skip (só build e deploy)"
        required: false
        type: choice
        options: [ auto, skip ]
        default: auto

permissions:
  contents: read

concurrency:
  group: cd-aws
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  CLUSTER_NAME: fiapx

jobs:
  provision:
    # Em push na main inputs.provision vem vazio → roda; só o dispatch com "skip" pula.
    if: inputs.provision != 'skip'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: AWS
    concurrency:
      group: terraform-aws
      cancel-in-progress: false
    env:
      TF_VAR_cluster_role_arn: ${{ vars.EKS_CLUSTER_ROLE_ARN || '' }}
      TF_VAR_node_role_arn: ${{ vars.EKS_NODE_ROLE_ARN || '' }}
      # Opcionais: se o secret existir no GitHub o Terraform usa esse valor; vazio → gera e
      # publica no SSM (/fiapx/...). O job deploy lê tudo do SSM.
      TF_VAR_db_password: ${{ secrets.PROD_DB_PASSWORD }}
      TF_VAR_jwt_secret: ${{ secrets.PROD_JWT_SECRET }}
      TF_VAR_admin_password: ${{ secrets.PROD_ADMIN_PASSWORD }}
      TF_VAR_notification_webhook_url: ${{ secrets.PROD_NOTIFICATION_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform plan (+ apply se houver mudanças)
        run: ./scripts/aws-up.sh --region "$AWS_REGION" --apply-if-changed

  build-and-push:
    needs: provision
    # provision pode ter sido pulado (dispatch com skip); só não segue se falhou/cancelou.
    if: ${{ !cancelled() && needs.provision.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: AWS
    outputs:
      ecr_registry: ${{ steps.ecr.outputs.registry }}
    strategy:
      matrix:
        service: [video-gateway, video-api, video-worker, notification-worker, web]
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/fiapx/${{ matrix.service }}:latest
            ${{ steps.ecr.outputs.registry }}/fiapx/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  deploy:
    needs: [ provision, build-and-push ]
    if: ${{ !cancelled() && needs.build-and-push.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: AWS
    steps:
      - uses: actions/checkout@v7

      - name: Instalar kubectl, kustomize e helm
        run: |
          KUBECTL_VERSION="$(curl -Ls https://dl.k8s.io/release/stable.txt)"
          curl -LO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/kubectl

          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/kustomize

          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Gerar kubeconfig do cluster EKS
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$CLUSTER_NAME"

      - name: Deploy no cluster
        env:
          ECR_REGISTRY: ${{ needs.build-and-push.outputs.ecr_registry }}
          IMAGE_TAG: ${{ github.sha }}
          # DB_USER/DB_PASSWORD/JWT_SECRET/NOTIFICATION_WEBHOOK_URL vêm do SSM (/fiapx/...).
        run: ./scripts/k8s-deploy-aws.sh
