name: CI - video-api

on:
  push:
    branches: [ main, develop ]
    paths:
      - "video-api/**"
      - ".github/workflows/ci-video-api.yml"
  pull_request:
    paths:
      - "video-api/**"
      - ".github/workflows/ci-video-api.yml"

defaults:
  run:
    working-directory: video-api

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Build and test
        run: ./mvnw -B verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-api-test-reports
          path: video-api/target/surefire-reports/
          retention-days: 7

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-api-coverage-report
          path: video-api/target/site/jacoco/
          retention-days: 7
