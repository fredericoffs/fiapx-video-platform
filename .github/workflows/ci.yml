name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
  # k8s-smoke-test (Sprint 4) só roda sob demanda: `main` ainda não existe no remoto,
  # então o deploy automático em push/merge é escopo da Sprint 7 (que também cria a
  # main de verdade) — aqui só validamos manualmente que os manifests/scripts
  # funcionam de ponta a ponta, sem atrasar o CI normal de todo push/PR com um
  # cluster kind inteiro.
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      changes: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            video-gateway:
              - 'video-gateway/**'
              - '.github/workflows/ci.yml'
            video-worker:
              - 'video-worker/**'
              - '.github/workflows/ci.yml'
            video-api:
              - 'video-api/**'
              - '.github/workflows/ci.yml'
            notification-worker:
              - 'notification-worker/**'
              - '.github/workflows/ci.yml'
            web:
              - 'web/**'
              - '.github/workflows/ci.yml'

  build-test-video-gateway:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.changes), 'video-gateway')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: video-gateway
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"
      - name: Build and test
        run: ./mvnw -B verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: video-gateway-test-reports
          path: video-gateway/target/surefire-reports/
          retention-days: 7
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: video-gateway-coverage-report
          path: video-gateway/target/site/jacoco/
          retention-days: 7

  build-test-video-worker:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.changes), 'video-worker')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: video-worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"
      - name: Build and test
        run: ./mvnw -B verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: video-worker-test-reports
          path: video-worker/target/surefire-reports/
          retention-days: 7
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: video-worker-coverage-report
          path: video-worker/target/site/jacoco/
          retention-days: 7

  build-test-video-api:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.changes), 'video-api')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: video-api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"
      - name: Build and test
        run: ./mvnw -B verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: video-api-test-reports
          path: video-api/target/surefire-reports/
          retention-days: 7
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: video-api-coverage-report
          path: video-api/target/site/jacoco/
          retention-days: 7

  build-test-notification-worker:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.changes), 'notification-worker')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: notification-worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"
      - name: Build and test
        run: ./mvnw -B verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: notification-worker-test-reports
          path: notification-worker/target/surefire-reports/
          retention-days: 7
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: notification-worker-coverage-report
          path: notification-worker/target/site/jacoco/
          retention-days: 7

  build-test-web:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.changes), 'web')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci

      # Codegen precisa do video-api real de pé (mesmo contrato descrito no
      # web/README.md) — se o cliente commitado (schema.gen.ts) divergir do spec
      # atual, o build quebra aqui, não em produção. `docker compose up video-api`
      # já sobe postgres/rabbitmq/redis/minio como dependência (depends_on).
      - name: Start video-api for codegen verification
        run: docker compose --profile app up -d video-api

      - name: Wait for video-api
        run: |
          for _attempt in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/actuator/health)"
            if [ "$code" = "200" ]; then
              echo "video-api healthy"
              exit 0
            fi
            sleep 2
          done
          echo "video-api não respondeu a tempo"
          exit 1

      - name: Verify OpenAPI codegen has no drift
        working-directory: web
        run: |
          npm run codegen
          git diff --exit-code -- src/shared/api/schema.gen.ts

      - name: Stop infra
        if: always()
        run: docker compose --profile app down

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Unit tests
        working-directory: web
        run: npm test

      - name: Build
        working-directory: web
        run: npm run build

      - name: Build Docker image
        working-directory: web
        run: docker build -t web:ci .

  # Os 4 jobs de segurança abaixo formam uma corrente sequencial fixa
  # (gateway -> worker -> api -> notification-worker) via `needs`, para nunca ter mais de
  # um job batendo na NVD API ao mesmo tempo: rodando em paralelo, os 4 tentavam baixar a
  # base inteira simultaneamente e a NVD começava a devolver 503 (rate limit) para quem não
  # terminava a tempo. Só o primeiro da fila paga o download completo a frio; os seguintes
  # encontram a base já quente (mesma key do dia) e fazem sync incremental em ~1-2min.
  # `always() + needs.<build-test>.result == 'success'` em vez do `if` implícito: sem isso,
  # se o elo anterior da corrente for pulado (serviço sem mudança) ou falhar, o job seguinte
  # seria pulado em cascata mesmo quando o SEU próprio serviço mudou e precisa ser escaneado.
  # Não depende do target/ do job de build-test: o Dockerfile roda `mvn package` sozinho
  # dentro do multi-stage build, e o dependency-check só precisa resolver as dependências,
  # não dos .class já compilados.
  security-video-gateway:
    needs: [ changes, build-test-video-gateway ]
    if: contains(fromJSON(needs.changes.outputs.changes), 'video-gateway')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: video-gateway
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      # Cache da base NVD compartilhado pelos 4 serviços (mesma key em todos os jobs de
      # segurança, path definido via dataDirectory no pom.xml). Key por dia: a base do NVD
      # não precisa de frescor de hora em hora para fins de scan, e uma key por hora gerava
      # uma entrada de cache nova a cada execução, pressionando o limite de 10GB do
      # repositório e arriscando despejar outros caches (ex.: o do Maven). restore-keys
      # busca a cópia mais recente disponível para sync incremental em vez de do zero.
      - name: Get date for Dependency-Check cache key
        id: get-date
        run: echo "date=$(/bin/date -u "+%Y%m%d")" >> "$GITHUB_OUTPUT"

      - name: Restore Dependency-Check NVD cache
        id: restore-cache
        uses: actions/cache/restore@v6
        with:
          path: .dependency-check-data
          key: dependency-check-nvd-${{ steps.get-date.outputs.date }}
          restore-keys: |
            dependency-check-nvd-

      - name: OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./mvnw -B dependency-check:check

      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: video-gateway-dependency-check-report
          path: video-gateway/target/dependency-check-report.html
          retention-days: 7

      - name: Build Docker image
        run: docker build -t video-gateway:ci .

      # trivy-action pinned by commit SHA (not a tag): tags 0.0.1-0.34.2 were compromised in a
      # 2026-03 supply-chain attack (GHSA-69fq-xp46-6x23). SHA below is the v0.36.0 tag, released
      # after the fix. `version` is pinned explicitly for the same reason (avoid the
      # compromised trivy CLI v0.69.4 / DockerHub v0.69.5-v0.69.6 window from the same incident).
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: video-gateway:ci
          version: v0.74.0
          format: sarif
          output: video-gateway/trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: video-gateway-trivy-report
          path: video-gateway/trivy-results.sarif
          retention-days: 7

      # always() garante que a base fica salva mesmo se um passo depois do Dependency-Check
      # (build/scan da imagem, Trivy) falhar. cache-hit != 'true' evita tentar salvar de novo
      # sob a mesma key exata do dia (job seguinte da corrente restaura o que o anterior já
      # salvou) — isso sempre falharia (`actions/cache` não sobrescreve key existente) e só
      # gerava o warning "Cache save failed" à toa nos jobs depois do primeiro da fila.
      - name: Save Dependency-Check NVD cache
        if: always() && steps.restore-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .dependency-check-data
          key: dependency-check-nvd-${{ steps.get-date.outputs.date }}

  security-video-worker:
    needs: [ changes, build-test-video-worker, security-video-gateway ]
    if: |
      always() &&
      contains(fromJSON(needs.changes.outputs.changes), 'video-worker') &&
      needs.build-test-video-worker.result == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: video-worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Get date for Dependency-Check cache key
        id: get-date
        run: echo "date=$(/bin/date -u "+%Y%m%d")" >> "$GITHUB_OUTPUT"

      - name: Restore Dependency-Check NVD cache
        id: restore-cache
        uses: actions/cache/restore@v6
        with:
          path: .dependency-check-data
          key: dependency-check-nvd-${{ steps.get-date.outputs.date }}
          restore-keys: |
            dependency-check-nvd-

      - name: OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./mvnw -B dependency-check:check

      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: video-worker-dependency-check-report
          path: video-worker/target/dependency-check-report.html
          retention-days: 7

      - name: Build Docker image
        run: docker build -t video-worker:ci .

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: video-worker:ci
          version: v0.74.0
          format: sarif
          output: video-worker/trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: video-worker-trivy-report
          path: video-worker/trivy-results.sarif
          retention-days: 7

      - name: Save Dependency-Check NVD cache
        if: always() && steps.restore-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .dependency-check-data
          key: dependency-check-nvd-${{ steps.get-date.outputs.date }}

  security-video-api:
    needs: [ changes, build-test-video-api, security-video-worker ]
    if: |
      always() &&
      contains(fromJSON(needs.changes.outputs.changes), 'video-api') &&
      needs.build-test-video-api.result == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: video-api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Get date for Dependency-Check cache key
        id: get-date
        run: echo "date=$(/bin/date -u "+%Y%m%d")" >> "$GITHUB_OUTPUT"

      - name: Restore Dependency-Check NVD cache
        id: restore-cache
        uses: actions/cache/restore@v6
        with:
          path: .dependency-check-data
          key: dependency-check-nvd-${{ steps.get-date.outputs.date }}
          restore-keys: |
            dependency-check-nvd-

      - name: OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./mvnw -B dependency-check:check

      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: video-api-dependency-check-report
          path: video-api/target/dependency-check-report.html
          retention-days: 7

      - name: Build Docker image
        run: docker build -t video-api:ci .

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: video-api:ci
          version: v0.74.0
          format: sarif
          output: video-api/trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: video-api-trivy-report
          path: video-api/trivy-results.sarif
          retention-days: 7

      - name: Save Dependency-Check NVD cache
        if: always() && steps.restore-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .dependency-check-data
          key: dependency-check-nvd-${{ steps.get-date.outputs.date }}

  # Validação de ponta a ponta dos manifests da Sprint 4 (k8s/) — sobe um cluster kind
  # de verdade no runner, aplica os mesmos manifests/scripts usados localmente
  # (scripts/k8s-up.sh, não uma cópia divergente) e prova que o KEDA escala o
  # video-worker sob carga. workflow_dispatch-only, ver comentário no gatilho `on:`.
  # kubectl/kind/helm instalados via download oficial (não Actions de terceiros) —
  # mesma cautela de cadeia de suprimentos do Trivy (ver security-video-gateway).
  k8s-smoke-test:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install kubectl
        run: |
          KUBECTL_VERSION="$(curl -Ls https://dl.k8s.io/release/stable.txt)"
          curl -LO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

      - name: Install kind
        run: |
          KIND_VERSION="$(curl -Ls https://api.github.com/repos/kubernetes-sigs/kind/releases/latest | jq -r .tag_name)"
          curl -Lo kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          chmod +x kind
          sudo mv kind /usr/local/bin/kind

      - name: Install helm
        run: curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Ensure ffmpeg is present
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Bring up local Kubernetes environment
        run: ./scripts/k8s-up.sh

      - name: Run load test
        run: ./scripts/k8s-loadtest.sh 20

      # video-worker começa com 1 réplica (minReplicaCount do ScaledObject) — sob os 20
      # uploads do load test, a fila video.processing deve passar do threshold
      # (queueLength=5) e o KEDA escalar antes do timeout de 5min abaixo.
      - name: Assert video-worker scaled beyond minimum
        run: |
          for _attempt in $(seq 1 30); do
            REPLICAS="$(kubectl -n fiapx get deployment video-worker -o jsonpath='{.status.replicas}')"
            echo "video-worker replicas: ${REPLICAS}"
            if [ "${REPLICAS}" -gt 1 ]; then
              echo "escalou para ${REPLICAS} réplicas"
              exit 0
            fi
            sleep 10
          done
          echo "video-worker nunca escalou acima do mínimo em 5 min"
          exit 1

      - name: Dump pod status on failure
        if: failure()
        run: |
          kubectl -n fiapx get pods
          kubectl -n fiapx describe pods
          kubectl -n fiapx logs -l app.kubernetes.io/name=video-worker --tail=200

      - name: Tear down cluster
        if: always()
        run: ./scripts/k8s-down.sh

  # E2E do fluxo feliz completo (Sprint 5) contra o docker-compose real — mesmo
  # padrão do k8s-smoke-test acima: workflow_dispatch-only, não atrasa o CI normal
  # de todo push/PR com uma stack inteira de pé. O playwright.config.ts já sobe seu
  # próprio `npm run dev` como servidor (CI=true no runner desliga
  # reuseExistingServer), então só a stack de backend precisa ser levantada aqui —
  # não o serviço `web` do compose.
  e2e-web:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Start backend stack
        run: docker compose --profile app up -d video-api video-worker notification-worker video-gateway

      - name: Wait for video-api
        run: |
          for _attempt in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/actuator/health)"
            if [ "$code" = "200" ]; then
              echo "video-api healthy"
              exit 0
            fi
            sleep 2
          done
          echo "video-api não respondeu a tempo"
          exit 1

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: web
        run: npm run test:e2e

      - name: Upload Playwright traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-e2e-test-results
          path: web/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Dump backend logs on failure
        if: failure()
        run: docker compose --profile app logs

      - name: Tear down stack
        if: always()
        run: docker compose --profile app down

  security-notification-worker:
    needs: [ changes, build-test-notification-worker, security-video-api ]
    if: |
      always() &&
      contains(fromJSON(needs.changes.outputs.changes), 'notification-worker') &&
      needs.build-test-notification-worker.result == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: notification-worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Get date for Dependency-Check cache key
        id: get-date
        run: echo "date=$(/bin/date -u "+%Y%m%d")" >> "$GITHUB_OUTPUT"

      - name: Restore Dependency-Check NVD cache
        id: restore-cache
        uses: actions/cache/restore@v6
        with:
          path: .dependency-check-data
          key: dependency-check-nvd-${{ steps.get-date.outputs.date }}
          restore-keys: |
            dependency-check-nvd-

      - name: OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./mvnw -B dependency-check:check

      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: notification-worker-dependency-check-report
          path: notification-worker/target/dependency-check-report.html
          retention-days: 7

      - name: Build Docker image
        run: docker build -t notification-worker:ci .

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: notification-worker:ci
          version: v0.74.0
          format: sarif
          output: notification-worker/trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: notification-worker-trivy-report
          path: notification-worker/trivy-results.sarif
          retention-days: 7

      - name: Save Dependency-Check NVD cache
        if: always() && steps.restore-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .dependency-check-data
          key: dependency-check-nvd-${{ steps.get-date.outputs.date }}
