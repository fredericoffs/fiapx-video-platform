name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      changes: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            infra:
              - 'k8s/**'
              - 'scripts/**'
              - '.github/workflows/**'
              # Sem isso, uma migration nova sem tocar em k8s/** nunca aciona a checagem
              # abaixo (migrations do video-api listadas no configMapGenerator) — item 17 da
              # revisão crítica.
              - 'video-api/src/main/resources/db/migration/**'
            video-gateway:
              - 'video-gateway/**'
              - '.github/workflows/ci.yml'
            video-worker:
              - 'video-worker/**'
              - '.github/workflows/ci.yml'
            video-api:
              - 'video-api/**'
              - 'web/**'
              - '.github/workflows/ci.yml'
            notification-worker:
              - 'notification-worker/**'
              - '.github/workflows/ci.yml'
            web:
              - 'web/**'
              - 'video-api/**'
              - '.github/workflows/ci.yml'

  build-test-video-gateway:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.changes), 'video-gateway')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: video-gateway
    # Sem default em produção (CORS aberto por omissão seria inseguro) — o CI precisa
    # de um valor próprio, só pra permitir o contexto Spring subir nos testes.
    env:
      VIDEO_API_URI: http://localhost:8081
      GATEWAY_CORS_ALLOWED_ORIGINS: http://localhost:5173
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"
      - name: Build and test
        run: ./mvnw -B verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: video-gateway-test-reports
          path: video-gateway/target/surefire-reports/
          retention-days: 7
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: video-gateway-coverage-report
          path: video-gateway/target/site/jacoco/
          retention-days: 7

  build-test-video-worker:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.changes), 'video-worker')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: video-worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"
      # FfmpegFrameExtractorRealBinaryTest roda contra o ffmpeg de verdade quando presente.
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Build and test
        run: ./mvnw -B verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: video-worker-test-reports
          path: video-worker/target/surefire-reports/
          retention-days: 7
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: video-worker-coverage-report
          path: video-worker/target/site/jacoco/
          retention-days: 7

  build-test-video-api:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.changes), 'video-api')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: video-api
    # Sem default em produção — o CI precisa de um valor próprio (≥32 chars pro HS256),
    # só pra permitir o contexto Spring subir nos testes.
    env:
      JWT_SECRET: ci-test-only-secret-never-used-in-production-min-32-chars
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"
      - name: Build and test
        run: ./mvnw -B verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: video-api-test-reports
          path: video-api/target/surefire-reports/
          retention-days: 7
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: video-api-coverage-report
          path: video-api/target/site/jacoco/
          retention-days: 7

      - name: Upload OpenAPI contract
        uses: actions/upload-artifact@v7
        with:
          name: video-api-openapi
          path: video-api/target/openapi.json
          if-no-files-found: error

  build-test-notification-worker:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.changes), 'notification-worker')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: notification-worker
    # Sem default em produção — o CI precisa de um valor próprio só pra permitir o
    # contexto Spring subir nos testes (o canal EMAIL falha no envio real, como esperado
    # sem um SMTP de verdade; os testes de circuit breaker/bulkhead do canal já apontam
    # pra um host/porta próprios via @TestPropertySource, então não dependem deste valor).
    env:
      SMTP_HOST: localhost
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"
      - name: Build and test
        run: ./mvnw -B verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: notification-worker-test-reports
          path: notification-worker/target/surefire-reports/
          retention-days: 7
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: notification-worker-coverage-report
          path: notification-worker/target/site/jacoco/
          retention-days: 7

  build-test-web:
    needs: [changes, build-test-video-api]
    if: contains(fromJSON(needs.changes.outputs.changes), 'web')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci

      - uses: actions/download-artifact@v8
        with:
          name: video-api-openapi
          path: web/.openapi-review
      - name: Verify generated OpenAPI types
        working-directory: web
        run: |
          ./node_modules/.bin/openapi-typescript .openapi-review/openapi.json -o .openapi-review/schema.gen.ts
          ./node_modules/.bin/prettier --write .openapi-review/schema.gen.ts
          diff -u src/shared/api/schema.gen.ts .openapi-review/schema.gen.ts
          rm -rf .openapi-review

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Unit tests
        working-directory: web
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-coverage-report
          path: web/coverage/
          retention-days: 7

      - name: Build
        working-directory: web
        run: npm run build

      - name: Build Docker image
        working-directory: web
        run: docker build -t web:ci .

  # Lint estático de tudo que não é código de serviço: scripts, workflows, Terraform e manifests k8s.
  infra-lint:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.changes), 'infra')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false
      - name: Install shellcheck, actionlint, kubectl
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash -s -- latest /usr/local/bin >/dev/null
          KUBECTL_VERSION="$(curl -Ls https://dl.k8s.io/release/stable.txt)"
          curl -LO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/kubectl
      - name: shellcheck
        run: shellcheck scripts/*.sh k8s/addons/*.sh
      - name: actionlint
        run: actionlint
      - name: terraform fmt + validate (sem backend)
        working-directory: k8s/terraform/aws
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
      - name: migrations do video-api listadas no configMapGenerator
        # O Job de migração só enxerga os .sql listados em k8s/apps/base/video-api/kustomization.yaml.
        run: |
          missing=0
          for f in video-api/src/main/resources/db/migration/*.sql; do
            grep -q "db/migration/$(basename "$f")" k8s/apps/base/video-api/kustomization.yaml || { echo "faltando no configMapGenerator: $f"; missing=1; }
          done
          exit $missing
      - name: kustomize (manifests da aplicação e add-ons)
        run: |
          kubectl kustomize --load-restrictor LoadRestrictionsNone k8s/apps/base > /dev/null
          kubectl kustomize k8s/addons > /dev/null

