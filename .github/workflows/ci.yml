name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
  # k8s-smoke-test/e2e-web só rodam sob demanda, não em todo push/PR.
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      changes: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            video-gateway:
              - 'video-gateway/**'
              - '.github/workflows/ci.yml'
            video-worker:
              - 'video-worker/**'
              - '.github/workflows/ci.yml'
            video-api:
              - 'video-api/**'
              - '.github/workflows/ci.yml'
            notification-worker:
              - 'notification-worker/**'
              - '.github/workflows/ci.yml'
            web:
              - 'web/**'
              - '.github/workflows/ci.yml'

  build-test-video-gateway:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.changes), 'video-gateway')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: video-gateway
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"
      - name: Build and test
        run: ./mvnw -B verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: video-gateway-test-reports
          path: video-gateway/target/surefire-reports/
          retention-days: 7
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: video-gateway-coverage-report
          path: video-gateway/target/site/jacoco/
          retention-days: 7

  build-test-video-worker:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.changes), 'video-worker')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: video-worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"
      - name: Build and test
        run: ./mvnw -B verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: video-worker-test-reports
          path: video-worker/target/surefire-reports/
          retention-days: 7
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: video-worker-coverage-report
          path: video-worker/target/site/jacoco/
          retention-days: 7

  build-test-video-api:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.changes), 'video-api')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: video-api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"
      - name: Build and test
        run: ./mvnw -B verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: video-api-test-reports
          path: video-api/target/surefire-reports/
          retention-days: 7
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: video-api-coverage-report
          path: video-api/target/site/jacoco/
          retention-days: 7

  build-test-notification-worker:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.changes), 'notification-worker')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: notification-worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"
      - name: Build and test
        run: ./mvnw -B verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: notification-worker-test-reports
          path: notification-worker/target/surefire-reports/
          retention-days: 7
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: notification-worker-coverage-report
          path: notification-worker/target/site/jacoco/
          retention-days: 7

  build-test-web:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.changes), 'web')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci

      # Codegen precisa do video-api real de pé, pra pegar drift entre schema.gen.ts e o spec atual.
      - name: Start video-api for codegen verification
        run: docker compose --profile app up -d video-api

      - name: Wait for video-api
        run: |
          for _attempt in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/actuator/health || true)"
            if [ "$code" = "200" ]; then
              echo "video-api healthy"
              exit 0
            fi
            sleep 2
          done
          echo "video-api não respondeu a tempo"
          exit 1

      - name: Verify OpenAPI codegen has no drift
        working-directory: web
        run: |
          npm run codegen
          git diff --exit-code -- src/shared/api/schema.gen.ts

      - name: Stop infra
        if: always()
        run: docker compose --profile app down

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Unit tests
        working-directory: web
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-coverage-report
          path: web/coverage/
          retention-days: 7

      - name: Build
        working-directory: web
        run: npm run build

      - name: Build Docker image
        working-directory: web
        run: docker build -t web:ci .

  # Os 4 jobs de segurança rodam em corrente sequencial (needs) pra não estourar
  # rate limit da NVD API com downloads simultâneos da base. `always() + result ==
  # 'success'` evita que um elo pulado/falho pule os seguintes em cascata.
  security-video-gateway:
    needs: [ changes, build-test-video-gateway ]
    if: contains(fromJSON(needs.changes.outputs.changes), 'video-gateway')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: video-gateway
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      # Cache da base NVD compartilhado entre os 4 serviços, key por dia (não por hora,
      # pra não pressionar o limite de 10GB de cache do repositório).
      - name: Get date for Dependency-Check cache key
        id: get-date
        run: echo "date=$(/bin/date -u "+%Y%m%d")" >> "$GITHUB_OUTPUT"

      - name: Restore Dependency-Check NVD cache
        id: restore-cache
        uses: actions/cache/restore@v6
        with:
          path: .dependency-check-data
          key: dependency-check-nvd-${{ steps.get-date.outputs.date }}
          restore-keys: |
            dependency-check-nvd-

      - name: OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./mvnw -B dependency-check:check

      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: video-gateway-dependency-check-report
          path: video-gateway/target/dependency-check-report.html
          retention-days: 7

      - name: Build Docker image
        run: docker build -t video-gateway:ci .

      # Pinado por SHA (não tag): tags 0.0.1-0.34.2 tiveram supply-chain attack (GHSA-69fq-xp46-6x23).
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: video-gateway:ci
          version: v0.74.0
          format: sarif
          output: video-gateway/trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: video-gateway-trivy-report
          path: video-gateway/trivy-results.sarif
          retention-days: 7

      # cache-hit != 'true' evita tentar salvar de novo sob a mesma key do dia.
      - name: Save Dependency-Check NVD cache
        if: always() && steps.restore-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .dependency-check-data
          key: dependency-check-nvd-${{ steps.get-date.outputs.date }}

  security-video-worker:
    needs: [ changes, build-test-video-worker, security-video-gateway ]
    if: |
      always() &&
      contains(fromJSON(needs.changes.outputs.changes), 'video-worker') &&
      needs.build-test-video-worker.result == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: video-worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Get date for Dependency-Check cache key
        id: get-date
        run: echo "date=$(/bin/date -u "+%Y%m%d")" >> "$GITHUB_OUTPUT"

      - name: Restore Dependency-Check NVD cache
        id: restore-cache
        uses: actions/cache/restore@v6
        with:
          path: .dependency-check-data
          key: dependency-check-nvd-${{ steps.get-date.outputs.date }}
          restore-keys: |
            dependency-check-nvd-

      - name: OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./mvnw -B dependency-check:check

      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: video-worker-dependency-check-report
          path: video-worker/target/dependency-check-report.html
          retention-days: 7

      - name: Build Docker image
        run: docker build -t video-worker:ci .

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: video-worker:ci
          version: v0.74.0
          format: sarif
          output: video-worker/trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: video-worker-trivy-report
          path: video-worker/trivy-results.sarif
          retention-days: 7

      - name: Save Dependency-Check NVD cache
        if: always() && steps.restore-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .dependency-check-data
          key: dependency-check-nvd-${{ steps.get-date.outputs.date }}

  security-video-api:
    needs: [ changes, build-test-video-api, security-video-worker ]
    if: |
      always() &&
      contains(fromJSON(needs.changes.outputs.changes), 'video-api') &&
      needs.build-test-video-api.result == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: video-api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Get date for Dependency-Check cache key
        id: get-date
        run: echo "date=$(/bin/date -u "+%Y%m%d")" >> "$GITHUB_OUTPUT"

      - name: Restore Dependency-Check NVD cache
        id: restore-cache
        uses: actions/cache/restore@v6
        with:
          path: .dependency-check-data
          key: dependency-check-nvd-${{ steps.get-date.outputs.date }}
          restore-keys: |
            dependency-check-nvd-

      - name: OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./mvnw -B dependency-check:check

      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: video-api-dependency-check-report
          path: video-api/target/dependency-check-report.html
          retention-days: 7

      - name: Build Docker image
        run: docker build -t video-api:ci .

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: video-api:ci
          version: v0.74.0
          format: sarif
          output: video-api/trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: video-api-trivy-report
          path: video-api/trivy-results.sarif
          retention-days: 7

      - name: Save Dependency-Check NVD cache
        if: always() && steps.restore-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .dependency-check-data
          key: dependency-check-nvd-${{ steps.get-date.outputs.date }}

  # Valida os manifests k8s/ contra um cluster kind real, provando que o KEDA escala
  # o video-worker sob carga (scripts/k8s-up.sh, mesmo script usado localmente).
  k8s-smoke-test:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install kubectl
        run: |
          KUBECTL_VERSION="$(curl -Ls https://dl.k8s.io/release/stable.txt)"
          curl -LO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

      - name: Install kind
        run: |
          KIND_VERSION="$(curl -Ls https://api.github.com/repos/kubernetes-sigs/kind/releases/latest | jq -r .tag_name)"
          curl -Lo kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          chmod +x kind
          sudo mv kind /usr/local/bin/kind

      - name: Install helm
        run: curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Ensure ffmpeg is present
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Bring up local Kubernetes environment
        run: ./scripts/k8s-up.sh

      - name: Run load test
        run: ./scripts/k8s-loadtest.sh 20

      - name: Assert video-worker scaled beyond minimum
        run: |
          for _attempt in $(seq 1 30); do
            REPLICAS="$(kubectl -n fiapx get deployment video-worker -o jsonpath='{.status.replicas}')"
            echo "video-worker replicas: ${REPLICAS}"
            if [ "${REPLICAS}" -gt 1 ]; then
              echo "escalou para ${REPLICAS} réplicas"
              exit 0
            fi
            sleep 10
          done
          echo "video-worker nunca escalou acima do mínimo em 5 min"
          exit 1

      - name: Dump pod status on failure
        if: failure()
        run: |
          kubectl -n fiapx get pods
          kubectl -n fiapx describe pods
          kubectl -n fiapx logs -l app.kubernetes.io/name=video-worker --tail=200

      - name: Tear down cluster
        if: always()
        run: ./scripts/k8s-down.sh

  # E2E do fluxo feliz contra docker-compose real. playwright.config.ts sobe seu
  # próprio `npm run dev`, então só preciso levantar a stack de backend aqui.
  e2e-web:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Start backend stack
        run: docker compose --profile app up -d video-api video-worker notification-worker video-gateway

      - name: Wait for video-api
        run: |
          for _attempt in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/actuator/health || true)"
            if [ "$code" = "200" ]; then
              echo "video-api healthy"
              exit 0
            fi
            sleep 2
          done
          echo "video-api não respondeu a tempo"
          exit 1

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: web
        run: npm run test:e2e

      - name: Upload Playwright traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-e2e-test-results
          path: web/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Dump backend logs on failure
        if: failure()
        run: docker compose --profile app logs

      - name: Tear down stack
        if: always()
        run: docker compose --profile app down

  security-notification-worker:
    needs: [ changes, build-test-notification-worker, security-video-api ]
    if: |
      always() &&
      contains(fromJSON(needs.changes.outputs.changes), 'notification-worker') &&
      needs.build-test-notification-worker.result == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: notification-worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Get date for Dependency-Check cache key
        id: get-date
        run: echo "date=$(/bin/date -u "+%Y%m%d")" >> "$GITHUB_OUTPUT"

      - name: Restore Dependency-Check NVD cache
        id: restore-cache
        uses: actions/cache/restore@v6
        with:
          path: .dependency-check-data
          key: dependency-check-nvd-${{ steps.get-date.outputs.date }}
          restore-keys: |
            dependency-check-nvd-

      - name: OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./mvnw -B dependency-check:check

      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: notification-worker-dependency-check-report
          path: notification-worker/target/dependency-check-report.html
          retention-days: 7

      - name: Build Docker image
        run: docker build -t notification-worker:ci .

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: notification-worker:ci
          version: v0.74.0
          format: sarif
          output: notification-worker/trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: notification-worker-trivy-report
          path: notification-worker/trivy-results.sarif
          retention-days: 7

      - name: Save Dependency-Check NVD cache
        if: always() && steps.restore-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .dependency-check-data
          key: dependency-check-nvd-${{ steps.get-date.outputs.date }}
