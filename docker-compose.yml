name: fiapx-video-platform

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-fiapx}
      POSTGRES_USER: ${DB_USER:-fiapx}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fiapx}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-fiapx} -d ${DB_NAME:-fiapx}"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 512m

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672" # UI: http://localhost:15672
      - "${RABBITMQ_PROMETHEUS_PORT:-15692}:15692" # métricas: rabbitmq_prometheus já vem habilitado na imagem -management
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 512m

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 256m

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-minioadmin}
    ports:
      - "${STORAGE_PORT:-9000}:9000"
      - "${STORAGE_CONSOLE_PORT:-9001}:9001" # UI: http://localhost:9001
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 512m

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${STORAGE_ACCESS_KEY:-minioadmin} ${STORAGE_SECRET_KEY:-minioadmin} &&
      mc mb -p local/${STORAGE_BUCKET_RAW:-videos-raw} &&
      mc mb -p local/${STORAGE_BUCKET_PROCESSED:-videos-processed} &&
      exit 0
      "

  mailhog:
    image: axllent/mailpit:latest
    ports:
      - "${SMTP_PORT:-1025}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025" # UI: http://localhost:8025
    mem_limit: 128m

  video-api:
    build: ./video-api
    # Deixo a porta exposta publicamente só por conveniência de debug/teste local (dev):
    # isso permite bypassar o video-gateway e furar CORS/rate-limit de borda. No
    # Kubernetes (k8s/apps/base/video-api) já mantenho o video-api ClusterIP-only —
    # só o video-gateway fica exposto (LoadBalancer/Ingress).
    ports:
      - "8081:8081"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-fiapx}
      DB_USER: ${DB_USER:-fiapx}
      DB_PASSWORD: ${DB_PASSWORD:-fiapx}
      RABBITMQ_HOST: rabbitmq
      REDIS_HOST: redis
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-minioadmin}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-minioadmin}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-min-32-chars-please}
      LOGIN_RATE_LIMIT_MAX_ATTEMPTS: ${LOGIN_RATE_LIMIT_MAX_ATTEMPTS:-5}
      LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:-60}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    profiles: ["app"]

  video-worker:
    build: ./video-worker
    ports:
      - "8082:8082"
    environment:
      RABBITMQ_HOST: rabbitmq
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-minioadmin}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-minioadmin}
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    profiles: ["app"]

  notification-worker:
    build: ./notification-worker
    ports:
      - "8083:8083"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-fiapx}
      DB_USER: ${DB_USER:-fiapx}
      DB_PASSWORD: ${DB_PASSWORD:-fiapx}
      RABBITMQ_HOST: rabbitmq
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    profiles: ["app"]

  video-gateway:
    build: ./video-gateway
    ports:
      - "8080:8080"
    environment:
      VIDEO_API_URI: http://video-api:8081
      REDIS_HOST: redis
      GATEWAY_RATE_LIMIT_CAPACITY: ${GATEWAY_RATE_LIMIT_CAPACITY:-20}
      GATEWAY_RATE_LIMIT_PERIOD_SECONDS: ${GATEWAY_RATE_LIMIT_PERIOD_SECONDS:-60}
      # Uso um default restrito à origem da SPA (Sprint 5), não "*" — sobrescrevível via .env.
      GATEWAY_CORS_ALLOWED_ORIGINS: ${GATEWAY_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    depends_on:
      redis:
        condition: service_healthy
      video-api:
        condition: service_started
    profiles: ["app"]

  web:
    build:
      context: ./web
      args:
        # É falado pelo browser, não pelo container — publico o gateway na mesma
        # porta 8080 do host em todos os contextos locais (compose/kind), então o
        # default já serve sem override.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    ports:
      - "5173:8080"
    depends_on:
      video-gateway:
        condition: service_started
    profiles: ["app"]

volumes:
  postgres-data:
  minio-data:
