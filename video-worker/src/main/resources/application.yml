spring:
  application:
    name: video-worker
  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      # Item 16 da revisão crítica: separa /actuator/health/liveness (só o processo) de
      # /actuator/health/readiness — ver comentário equivalente no video-api. Sem
      # datasource/Redis aqui (ADR-008), os dois grupos ficam praticamente equivalentes hoje,
      # mas ficam prontos pra qualquer indicador futuro sem precisar mexer nos probes de novo.
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# Fiz o video-worker stateless por decisão (ver docs/architecture/hld-lld-adr-rfc.md, ADR-008) — não coloco datasource aqui de propósito.
fiapx:
  storage:
    endpoint: ${STORAGE_ENDPOINT:}
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}
    bucket-raw: ${STORAGE_BUCKET_RAW:videos-raw}
    bucket-processed: ${STORAGE_BUCKET_PROCESSED:videos-processed}
    region: ${STORAGE_REGION:us-east-1}
    path-style: ${STORAGE_PATH_STYLE:false}
  ffmpeg:
    binary-path: ${FFMPEG_PATH:ffmpeg}
    ffprobe-binary-path: ${FFPROBE_PATH:ffprobe}
    fps: ${FFMPEG_FPS:1}
    # Prazo real do subprocesso; alinhar ao visibility timeout da fila de processamento.
    process-timeout-minutes: ${FFMPEG_TIMEOUT_MINUTES:15}
    # 1800s = 30 min. <= 0 desliga o limite.
    max-duration-seconds: ${FFMPEG_MAX_DURATION_SECONDS:1800}
    probe-timeout-seconds: ${FFMPEG_PROBE_TIMEOUT_SECONDS:30}
  sqs:
    region: ${AWS_REGION:us-east-1}
    endpoint: ${SQS_ENDPOINT:}
  queues:
    processing: ${QUEUE_PROCESSING:fiapx-video-processing}
    processing-dlq: ${QUEUE_PROCESSING_DLQ:fiapx-video-processing-dlq}
    status-updates: ${QUEUE_STATUS_UPDATES:fiapx-video-status-updates}

logging:
  # Formato logstash nativo do Spring Boot 4.1 (sem precisar do logstash-logback-encoder) —
  # já inclui o MDC inteiro (incluindo correlationId) como campos JSON de nível superior.
  structured:
    format:
      console: logstash
