spring:
  application:
    name: video-worker
  threads:
    virtual:
      enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        prefetch: ${RABBITMQ_PREFETCH:1}
        retry:
          enabled: true
          initial-interval: 2000
          multiplier: 2.0
          max-retries: 3

server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

# Fiz o video-worker stateless por decisão (ver docs/architecture/hld-lld-adr-rfc.md, ADR-008) — não coloco datasource aqui de propósito.
fiapx:
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${STORAGE_ACCESS_KEY:minioadmin}
    secret-key: ${STORAGE_SECRET_KEY:minioadmin}
    bucket-raw: ${STORAGE_BUCKET_RAW:videos-raw}
    bucket-processed: ${STORAGE_BUCKET_PROCESSED:videos-processed}
  ffmpeg:
    binary-path: ${FFMPEG_PATH:ffmpeg}
    fps: ${FFMPEG_FPS:1}
  queues:
    processing: ${QUEUE_PROCESSING:video.processing}
    status-updates: ${QUEUE_STATUS_UPDATES:video.status-updates}
    processing-dlx: ${QUEUE_PROCESSING_DLX:video.processing.dlx}
    processing-dlq: ${QUEUE_PROCESSING_DLQ:video.processing.dlq}

logging:
  pattern:
    level: "%5p [correlationId=%X{correlationId}]"
