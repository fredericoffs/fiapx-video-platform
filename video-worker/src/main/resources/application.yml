spring:
  application:
    name: video-worker
  threads:
    virtual:
      enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # Publisher confirms + returns: o resultado só é considerado publicado após o ack do broker
    # (ver RabbitMessagePublisher); sem isso o consumo da fila de processamento terminaria
    # com um resultado que ninguém recebeu.
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        prefetch: ${RABBITMQ_PREFETCH:1}
        retry:
          enabled: true
          initial-interval: 2000
          multiplier: 2.0
          max-retries: 3

server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

# Fiz o video-worker stateless por decisão (ver docs/architecture/hld-lld-adr-rfc.md, ADR-008) — não coloco datasource aqui de propósito.
fiapx:
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${STORAGE_ACCESS_KEY:minioadmin}
    secret-key: ${STORAGE_SECRET_KEY:minioadmin}
    bucket-raw: ${STORAGE_BUCKET_RAW:videos-raw}
    bucket-processed: ${STORAGE_BUCKET_PROCESSED:videos-processed}
    # Vazios no perfil aws: endpoint regional do S3 e credenciais da cadeia padrão do SDK.
    region: ${STORAGE_REGION:us-east-1}
    path-style: ${STORAGE_PATH_STYLE:true}
  ffmpeg:
    binary-path: ${FFMPEG_PATH:ffmpeg}
    ffprobe-binary-path: ${FFPROBE_PATH:ffprobe}
    fps: ${FFMPEG_FPS:1}
    # Prazo real do subprocesso; alinhar ao visibility timeout da fila de processamento.
    process-timeout-minutes: ${FFMPEG_TIMEOUT_MINUTES:15}
    # 1800s = 30 min. <= 0 desliga o limite.
    max-duration-seconds: ${FFMPEG_MAX_DURATION_SECONDS:1800}
  messaging:
    provider: ${MESSAGING_PROVIDER:rabbitmq}
    confirm-timeout: ${MESSAGING_CONFIRM_TIMEOUT:5s}
  queues:
    processing: ${QUEUE_PROCESSING:video.processing}
    status-updates: ${QUEUE_STATUS_UPDATES:video.status-updates}
    status-updates-dlx: ${QUEUE_STATUS_UPDATES_DLX:video.status-updates.dlx}
    status-updates-dlq: ${QUEUE_STATUS_UPDATES_DLQ:video.status-updates.dlq}
    processing-dlx: ${QUEUE_PROCESSING_DLX:video.processing.dlx}
    processing-dlq: ${QUEUE_PROCESSING_DLQ:video.processing.dlq}

logging:
  # Uso o formato logstash nativo do Spring Boot 4.1 (sem precisar do logstash-logback-encoder)
  # — confirmei rodando localmente que ele já inclui o MDC inteiro (incluindo correlationId)
  # como campos JSON de nível superior, sem configuração extra.
  structured:
    format:
      console: logstash
