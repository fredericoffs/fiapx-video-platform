# Perfil aws (SPRING_PROFILES_ACTIVE=aws): SQS no lugar do RabbitMQ.
# Sem RabbitMQ no classpath ativo: a autoconfiguração e o health indicator ficam fora, e os
# beans Rabbit (condicionais a fiapx.messaging.provider=rabbitmq) não são criados.
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.amqp.autoconfigure.RabbitAutoConfiguration
      - org.springframework.boot.amqp.autoconfigure.health.RabbitHealthContributorAutoConfiguration

fiapx:
  messaging:
    provider: sqs
  sqs:
    region: ${AWS_REGION:us-east-1}
    endpoint: ${SQS_ENDPOINT:}
  queues:
    notification: ${QUEUE_NOTIFICATION:fiapx-video-notification}
    notification-dlq: ${QUEUE_NOTIFICATION_DLQ:fiapx-video-notification-dlq}
