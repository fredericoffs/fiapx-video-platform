spring:
  application:
    name: notification-worker
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fiapx}?currentSchema=notification_worker
    username: ${DB_USER:fiapx}
    password: ${DB_PASSWORD:fiapx}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: notification_worker
  flyway:
    schemas: notification_worker
    default-schema: notification_worker
    create-schemas: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 2000
          multiplier: 2.0
          max-retries: 3
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}

server:
  port: ${SERVER_PORT:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

# Banco próprio (schema notification_worker) — ver docs/architecture/hld-lld-adr-rfc.md (LLD 5.5, ADR-008)
fiapx:
  notification:
    from-address: ${NOTIFICATION_FROM:no-reply@fiapx.local}
    webhook-fallback-url: ${NOTIFICATION_WEBHOOK_URL:}
  queues:
    notification: ${QUEUE_NOTIFICATION:video.notification}
    notification-dlx: ${QUEUE_NOTIFICATION_DLX:video.notification.dlx}
    notification-dlq: ${QUEUE_NOTIFICATION_DLQ:video.notification.dlq}

# Circuit Breaker + Bulkhead isolados por canal (tarefa 3 da Sprint 6) — thread-pool-bulkhead
# (não bulkhead simples) porque cada canal precisa de um pool de threads próprio de verdade.
resilience4j:
  circuitbreaker:
    instances:
      email-channel:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
      webhook-channel:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
  thread-pool-bulkhead:
    instances:
      email-channel:
        max-thread-pool-size: 4
        core-thread-pool-size: 2
        queue-capacity: 10
      webhook-channel:
        max-thread-pool-size: 4
        core-thread-pool-size: 2
        queue-capacity: 10

logging:
  pattern:
    level: "%5p [correlationId=%X{correlationId}]"
