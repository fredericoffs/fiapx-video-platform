spring:
  application:
    name: notification-worker
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:fiapx}?currentSchema=notification_worker&sslmode=${DB_SSLMODE:require}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: notification_worker
  flyway:
    schemas: notification_worker
    default-schema: notification_worker
    create-schemas: true
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}
          # Sem isso, o JavaMailSender não tem prazo pra conectar/ler/escrever no relay SMTP —
          # um relay que aceita a conexão e não responde prenderia o EmailChannel indefinidamente.
          connectiontimeout: ${SMTP_CONNECT_TIMEOUT_MS:5000}
          timeout: ${SMTP_READ_TIMEOUT_MS:10000}
          writetimeout: ${SMTP_WRITE_TIMEOUT_MS:10000}
  # Aplicado ao RestClient.Builder autoconfigurado (WebhookChannel) — mesmo motivo do timeout
  # de SMTP acima, mas pro canal de webhook.
  http:
    client:
      connect-timeout: ${WEBHOOK_CONNECT_TIMEOUT_MS:5000}
      read-timeout: ${WEBHOOK_READ_TIMEOUT_MS:10000}

server:
  port: ${SERVER_PORT:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  health:
    # Sem relay SMTP real garantido, uma falha de mail não pode derrubar a liveness — o
    # canal de e-mail já tem fallback pra webhook (ver ADR-012, estratégia de canal).
    mail:
      enabled: ${MANAGEMENT_HEALTH_MAIL_ENABLED:false}
  endpoint:
    health:
      # Item 16 da revisão crítica: separa /actuator/health/liveness (só o processo) de
      # /actuator/health/readiness (inclui db) — ver comentário equivalente no video-api.
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: ${spring.application.name}

# Banco próprio (schema notification_worker) — ver docs/architecture/04-lld.md (modelo de dados) e docs/architecture/adr/ADR-008-status-por-evento.md
fiapx:
  notification:
    from-address: ${NOTIFICATION_FROM:no-reply@fiapx.local}
    webhook-fallback-url: ${NOTIFICATION_WEBHOOK_URL:}
    channel-timeout: ${NOTIFICATION_CHANNEL_TIMEOUT:20s}
  sqs:
    region: ${AWS_REGION:us-east-1}
    endpoint: ${SQS_ENDPOINT:}
  queues:
    notification: ${QUEUE_NOTIFICATION:fiapx-video-notification}
    notification-dlq: ${QUEUE_NOTIFICATION_DLQ:fiapx-video-notification-dlq}

# Uso Circuit Breaker + Bulkhead isolados por canal (tarefa 3 da Sprint 6) — thread-pool-bulkhead
# (não bulkhead simples) porque cada canal precisa de um pool de threads próprio de verdade.
resilience4j:
  circuitbreaker:
    # Achei ao vivo (Sprint 7, increment 6.3): sem isso, o publisher de métricas do
    # resilience4j-spring-boot3 nunca aparece — o @ConditionalOnBean(MeterRegistry) dele
    # roda antes da auto-configuração do Prometheus (Micrometer) criar o bean, então a
    # condição falha e nenhuma métrica resilience4j_* é exportada. O caminho "legacy"
    # não depende dessa ordem e resolve. Confirmado via
    # --debug (relatório de avaliação de condições) + curl real no /actuator/prometheus.
    metrics:
      legacy:
        enabled: true
    instances:
      email-channel:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
      webhook-channel:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
  thread-pool-bulkhead:
    metrics:
      legacy:
        enabled: true
    instances:
      email-channel:
        max-thread-pool-size: 4
        core-thread-pool-size: 2
        queue-capacity: 10
      webhook-channel:
        max-thread-pool-size: 4
        core-thread-pool-size: 2
        queue-capacity: 10

logging:
  # Formato logstash nativo do Spring Boot 4.1 (sem precisar do logstash-logback-encoder) —
  # já inclui o MDC inteiro (incluindo correlationId) como campos JSON de nível superior.
  structured:
    format:
      console: logstash
