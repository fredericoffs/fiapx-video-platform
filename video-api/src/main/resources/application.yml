spring:
  application:
    name: video-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:fiapx}?currentSchema=video_api&sslmode=${DB_SSLMODE:require}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: video_api
  flyway:
    schemas: video_api
    default-schema: video_api
    create-schemas: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 520MB
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
      # Item 16 da revisão crítica: liveness/readiness apontavam pro mesmo /actuator/health
      # agregado — uma indisponibilidade de dependência (RDS, Redis) virava reinício repetido
      # do pod (liveness falhando) em vez de só sair da rotação de tráfego (readiness).
      # /actuator/health/liveness reflete só o processo; /actuator/health/readiness inclui db
      # e redis — combinado com os paths dos probes em k8s/apps/base/video-api/deployment.yaml.
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis
  metrics:
    tags:
      application: ${spring.application.name}
    # Histograma de latência HTTP (p95 no dashboard "Saúde dos serviços"); a faixa 5ms–30s
    # limita os buckets para não multiplicar as séries no Prometheus.
    distribution:
      percentiles-histogram:
        http.server.requests: true
      minimum-expected-value:
        http.server.requests: 5ms
      maximum-expected-value:
        http.server.requests: 30s

# Configuração específica do domínio — ver docs/ddd/linguagem-ubiqua.md e docs/architecture/hld-lld-adr-rfc.md (ADR-004, ADR-008)
fiapx:
  admin:
    # Vazio = seeder não faz nada (admin fica travado no placeholder do V8 até alguém
    # configurar isto). Vem do SSM /fiapx/admin/password via Terraform — nunca versionado.
    seed-password: ${ADMIN_SEED_PASSWORD:}
  storage:
    endpoint: ${STORAGE_ENDPOINT:}
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}
    bucket-raw: ${STORAGE_BUCKET_RAW:videos-raw}
    bucket-processed: ${STORAGE_BUCKET_PROCESSED:videos-processed}
    region: ${STORAGE_REGION:us-east-1}
    path-style: ${STORAGE_PATH_STYLE:false}
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:30}
  security:
    login-rate-limit:
      max-attempts: ${LOGIN_RATE_LIMIT_MAX_ATTEMPTS:5}
      window-seconds: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:60}
  sqs:
    region: ${AWS_REGION:us-east-1}
    endpoint: ${SQS_ENDPOINT:}
  queues:
    status-updates: ${QUEUE_STATUS_UPDATES:fiapx-video-status-updates}
    status-updates-dlq: ${QUEUE_STATUS_UPDATES_DLQ:fiapx-video-status-updates-dlq}
    notification: ${QUEUE_NOTIFICATION:fiapx-video-notification}
    processing: ${QUEUE_PROCESSING:fiapx-video-processing}
  outbox:
    publish-interval-ms: ${OUTBOX_PUBLISH_INTERVAL_MS:3000}
    batch-size: ${OUTBOX_BATCH_SIZE:50}

logging:
  # Formato logstash nativo do Spring Boot 4.1 (sem precisar do logstash-logback-encoder) —
  # já inclui o MDC inteiro (incluindo correlationId) como campos JSON de nível superior.
  structured:
    format:
      console: logstash
