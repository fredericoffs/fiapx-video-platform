# Loki em modo SingleBinary (um pod só, armazenamento em disco EBS via StorageClass gp3):
# suficiente para os logs da aplicação durante uma sessão do Learner Lab. O destroy apaga o
# namespace monitoring, o PVC vai junto, e a varredura de volumes soltos cobre o resto.
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    retention_period: 72h
    allow_structured_metadata: true
  compactor:
    retention_enabled: true
    delete_request_store: filesystem

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 10Gi
  # requests baixas: os 2 nós já reservam ~70% da CPU, e o KEDA precisa de 2×500m livres
  # pra subir o video-worker até 3 réplicas; o limite continua folgado pra consultas.
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi

# Componentes do modo distribuído, caches (o chunksCache padrão pede ~8GB de memória),
# gateway nginx, canary e testes: nada disso cabe ou faz sentido em 2 nós t3.large.
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
chunksCache:
  enabled: false
resultsCache:
  enabled: false
gateway:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
minio:
  enabled: false
