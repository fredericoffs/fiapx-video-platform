# Componentes de nó/control-plane desligados: não fazem sentido num nó kind local e
# não alimentam nenhum dos 3 dashboards da aplicação.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false
nodeExporter:
  enabled: false
kubeStateMetrics:
  enabled: false

prometheus:
  prometheusSpec:
    retention: 2d
    walCompression: true
    resources:
      requests:
        cpu: 250m
        memory: 384Mi
      limits:
        cpu: 500m
        memory: 768Mi

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

grafana:
  # limits.cpu baixo trava o boot da Grafana em CrashLoopBackOff (registra uma pilha
  # grande de apiservers internos no startup).
  # limits.memory em 384Mi OOMKillava o pod ~20min após o boot sob uso normal (dashboards
  # + consultas ao Prometheus); subiu junto com requests para manter a mesma folga 2x.
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 750m
      memory: 512Mi
  # O pod sobe com 2 sidecars (watcher de dashboards/datasources) que não herdam o
  # limite do container principal — precisam de resources próprios.
  sidecar:
    resources:
      requests:
        cpu: 25m
        memory: 48Mi
      limits:
        cpu: 50m
        memory: 128Mi
