# Control plane do EKS é gerenciado pela AWS: controller-manager, scheduler, proxy e etcd
# não são acessíveis para coleta.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false

# Saúde do cluster: kube-state-metrics (estado de pods, deployments, réplicas, restarts) e
# node-exporter (CPU, memória e disco dos nós) alimentam os dashboards prontos
# "Kubernetes / ..." e "Node Exporter / ..." do stack e as regras padrão de alerta
# (KubePodCrashLooping, KubeDeploymentReplicasMismatch, NodeFilesystemSpaceFillingUp...).
# requests baixas: a CPU reservada nos 2 nós já passa de 70%.
kubeStateMetrics:
  enabled: true
kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 48Mi
    limits:
      cpu: 100m
      memory: 128Mi
nodeExporter:
  enabled: true
prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 24Mi
    limits:
      cpu: 100m
      memory: 64Mi

prometheus:
  prometheusSpec:
    retention: 2d
    walCompression: true
    resources:
      requests:
        cpu: 250m
        memory: 384Mi
      limits:
        cpu: 500m
        memory: 768Mi

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
  # Item 19 da revisão crítica: as PrometheusRule (k8s/addons/queue-depth-alert.yaml) definem
  # QUANDO alertar, mas sem receiver configurado o alerta nunca "chega a alguém" — fica só
  # visível na UI do Alertmanager. webhook_configs vazio por padrão (nenhum destino real
  # configurado ainda, comportamento idêntico a hoje); install.sh aceita
  # ALERTMANAGER_WEBHOOK_URL e injeta via --set quando definido.
  config:
    route:
      receiver: default
      group_by: ["alertname", "queue"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 3h
    receivers:
      - name: default
        webhook_configs: []

grafana:
  # Logs: o Loki (values/loki.yaml) recebe o stdout dos pods pelo Alloy; uid fixo pro
  # dashboard dashboards/logs-aplicacao.json referenciar.
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      url: http://loki.monitoring.svc:3100
      access: proxy
      jsonData:
        maxLines: 1000
    # CloudWatch (RDS, SQS, ElastiCache, S3, NLB): authType default usa a cadeia padrão do
    # SDK, ou seja, o LabRole do nó via IMDS (hop limit 2 no launch template) — sem chave
    # nem secret. Leitura confirmada no Learner Lab (docs/Learner_Lab.md: CloudWatch
    # liberado; LabRole com permissões próximas às do usuário do console).
    - name: CloudWatch
      type: cloudwatch
      uid: cloudwatch
      access: proxy
      jsonData:
        authType: default
        defaultRegion: us-east-1
  # limits.cpu baixo trava o boot da Grafana em CrashLoopBackOff (registra uma pilha
  # grande de apiservers internos no startup).
  # limits.memory em 384Mi OOMKillava o pod ~20min após o boot sob uso normal (dashboards
  # + consultas ao Prometheus); subiu junto com requests para manter a mesma folga 2x.
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 750m
      memory: 512Mi
  # O pod sobe com 2 sidecars (watcher de dashboards/datasources) que não herdam o
  # limite do container principal — precisam de resources próprios.
  sidecar:
    resources:
      requests:
        cpu: 25m
        memory: 48Mi
      limits:
        cpu: 50m
        memory: 128Mi
