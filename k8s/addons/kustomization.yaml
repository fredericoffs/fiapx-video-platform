apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - queue-depth-alert.yaml
  - servicemonitors.yaml

# grafana_dashboard: "1" é o label que o sidecar da Grafana usa pra descobrir
# ConfigMaps de dashboard automaticamente.
configMapGenerator:
  - name: fiapx-grafana-dashboards
    files:
      - dashboards/volume-videos-processados.json
      - dashboards/duracao-processamento.json
      - dashboards/erros-circuit-breakers.json
      - dashboards/logs-aplicacao.json
      - dashboards/saude-servicos.json
      - dashboards/autoscaling-borda.json
    options:
      labels:
        grafana_dashboard: "1"
      disableNameSuffixHash: true
