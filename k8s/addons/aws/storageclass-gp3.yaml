# StorageClass padrão do cluster EKS. A partir do Kubernetes 1.30 o EKS não marca mais
# a gp2 como default, e os PVCs de k8s/infra (Postgres, Redis, RabbitMQ, MinIO) não
# fixam storageClassName — sem uma classe default ficam Pending. Provisionador CSI
# (add-on aws-ebs-csi-driver), volumes gp3, criados só quando o pod é agendado.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
allowVolumeExpansion: true
