# 1 nó só (control-plane, também agenda pods): kind não isola CPU/memória por nó de
# verdade quando os "nós" são containers Docker no mesmo host — mais nós só
# multiplicam overhead sem isolamento real. HPA/KEDA continuam provando escala real.
#
# extraPortMappings expõe o NodePort do video-gateway (30080) na porta 8080 do host, e
# o do web (30081) na 5173 — mesmas portas do npm run dev e do docker-compose local.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: fiapx
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
      - containerPort: 30081
        hostPort: 5173
        protocol: TCP
