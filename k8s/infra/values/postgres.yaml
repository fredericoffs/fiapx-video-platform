# Banco único, schema por serviço (video_api, notification_worker) — ver ADR-008.
# Credenciais só para uso local, iguais ao default do docker-compose.yml/.env.example.
auth:
  username: fiapx
  password: fiapx
  database: fiapx

primary:
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  persistence:
    enabled: true
    size: 1Gi
  readinessProbe:
    enabled: true
  livenessProbe:
    enabled: true

volumePermissions:
  enabled: false
