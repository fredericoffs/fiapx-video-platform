# Uso o nome "minio" — bate com STORAGE_ENDPOINT (http://minio:9000) no ConfigMap
# (k8s/apps/base/configmap.yaml) e com o hostname já usado no docker-compose.yml.
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: fiapx
  labels:
    app.kubernetes.io/name: minio
spec:
  selector:
    app.kubernetes.io/name: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
