# Nome fixo + delete-antes-de-aplicar (ver k8s/apps/base/video-api/migration-job.yaml):
# Job é imutável, não dá pra reaplicar com kubectl apply direto.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
  namespace: fiapx
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: mc
          image: minio/mc:latest
          envFrom:
            - secretRef:
                name: minio
          command:
            - /bin/sh
            - -c
            - |
              mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" &&
              mc mb -p local/videos-raw &&
              mc mb -p local/videos-processed
