# Manifest próprio (não Helm/Bitnami): docker.io/bitnami/rabbitmq não tem tag pública
# gratuita. Mesma imagem já usada no docker-compose.yml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: fiapx
  labels:
    app.kubernetes.io/name: rabbitmq
spec:
  replicas: 1
  strategy:
    type: Recreate # PVC ReadWriteOnce — evita 2 pods disputando o mesmo volume num rollout
  selector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          # rabbitmq_prometheus já vem no enabled_plugins default desta imagem — só
          # falta expor a porta.
          image: rabbitmq:3.13-management-alpine
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
            - name: prometheus
              containerPort: 15692
          envFrom:
            - secretRef:
                name: rabbitmq
          # timeoutSeconds explícito: rabbitmq-diagnostics sobe seu próprio nó Erlang
          # pra conectar — o default de 1s do probe não é suficiente.
          readinessProbe:
            exec:
              command: [ "rabbitmq-diagnostics", "-q", "ping" ]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command: [ "rabbitmq-diagnostics", "-q", "ping" ]
            initialDelaySeconds: 40
            periodSeconds: 15
            timeoutSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rabbitmq-data
