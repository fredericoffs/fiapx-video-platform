# Uso o nome "rabbitmq" — bate com RABBITMQ_HOST no ConfigMap (k8s/apps/base/configmap.yaml)
# e com o hostname já usado no docker-compose.yml.
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: fiapx
  labels:
    app.kubernetes.io/name: rabbitmq
spec:
  selector:
    app.kubernetes.io/name: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
    - name: prometheus
      port: 15692
      targetPort: 15692
