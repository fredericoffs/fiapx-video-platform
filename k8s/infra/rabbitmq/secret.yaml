# Mesmos valores fake do docker-compose.yml/.env.example — uso local apenas.
# Duplicado de propósito em vez de reusar k8s/apps/overlays/*/secret.yaml: a camada de
# infra (k8s/infra/) deve ser aplicável sozinha, sem depender da ordem de aplicação do
# overlay da aplicação.
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq
  namespace: fiapx
type: Opaque
stringData:
  RABBITMQ_DEFAULT_USER: "guest"
  RABBITMQ_DEFAULT_PASS: "guest"
