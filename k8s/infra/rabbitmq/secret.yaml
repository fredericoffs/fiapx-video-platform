# Uso os mesmos valores fake do docker-compose.yml/.env.example — uso local apenas.
# Duplico de propósito em vez de reusar k8s/apps/overlays/*/secret.yaml: quero que a
# camada de infra (k8s/infra/) seja aplicável sozinha, sem depender da ordem de
# aplicação do overlay da aplicação.
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq
  namespace: fiapx
type: Opaque
stringData:
  RABBITMQ_DEFAULT_USER: "guest"
  RABBITMQ_DEFAULT_PASS: "guest"
