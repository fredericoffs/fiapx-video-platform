# Duplicado de propósito (não reusa k8s/apps/overlays/*/secret.yaml): k8s/infra/ deve
# ser aplicável sozinho, sem depender do overlay da aplicação. Valores só p/ uso local.
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq
  namespace: fiapx
type: Opaque
stringData:
  RABBITMQ_DEFAULT_USER: "guest"
  RABBITMQ_DEFAULT_PASS: "guest"
