# Label "release: kube-prometheus-stack" obrigatório: o operator só escuta
# ServiceMonitors com esse label (serviceMonitorSelectorNilUsesHelmValues, default do chart).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: rabbitmq
  namespace: fiapx
  labels:
    app.kubernetes.io/name: rabbitmq
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
  endpoints:
    - port: prometheus
      path: /metrics
      interval: 15s
