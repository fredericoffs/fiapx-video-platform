apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fiapx

resources:
  - ../../base
  - secret.yaml

# NodePort fixo casando com extraPortMappings do kind (k8s/kind/cluster-config.yaml).
# SPRING_FLYWAY_ENABLED=false: quem migra é o migration-job.yaml (base), não o app.
patches:
  - target:
      kind: Service
      name: video-gateway
    patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30080
  - target:
      kind: Service
      name: web
    patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30081
  - target:
      kind: Deployment
      name: video-api
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env
        value: []
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: SPRING_FLYWAY_ENABLED
          value: "false"
