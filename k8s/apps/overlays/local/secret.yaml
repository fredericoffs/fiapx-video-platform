# Mesmos valores fake do .env.example (uso local apenas, NUNCA produção — mesmo aviso
# já presente lá). Fonte única do JWT_SECRET para todas as réplicas do video-api,
# fechando o risco descrito no ADR-010 (secret divergente entre réplicas).
apiVersion: v1
kind: Secret
metadata:
  name: fiapx-secrets
type: Opaque
stringData:
  JWT_SECRET: "change-me-in-production-min-32-chars-please"
  DB_USER: "fiapx"
  DB_PASSWORD: "fiapx"
  RABBITMQ_USER: "guest"
  RABBITMQ_PASSWORD: "guest"
  STORAGE_ACCESS_KEY: "minioadmin"
  STORAGE_SECRET_KEY: "minioadmin"
  # Usado pelo TriggerAuthentication do KEDA (video-worker/scaledobject.yaml) para
  # consultar profundidade de fila via API HTTP do management plugin do RabbitMQ.
  # FQDN, não hostname curto: o operador do KEDA roda no namespace "keda", não
  # "fiapx" — resolução de nome curto só funciona dentro do mesmo namespace do pod que
  # consulta. Descoberto ao vivo: "dial tcp: lookup rabbitmq ... no such host".
  RABBITMQ_MANAGEMENT_URL: "http://guest:guest@rabbitmq.fiapx.svc.cluster.local:15672/%2F"
