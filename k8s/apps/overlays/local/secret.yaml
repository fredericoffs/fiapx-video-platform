# Valores fake do .env.example — uso local apenas, NUNCA produção.
apiVersion: v1
kind: Secret
metadata:
  name: fiapx-secrets
type: Opaque
stringData:
  JWT_SECRET: "change-me-in-production-min-32-chars-please"
  DB_USER: "fiapx"
  DB_PASSWORD: "fiapx"
  RABBITMQ_USER: "guest"
  RABBITMQ_PASSWORD: "guest"
  STORAGE_ACCESS_KEY: "minioadmin"
  STORAGE_SECRET_KEY: "minioadmin"
  # FQDN, não hostname curto: o operador do KEDA roda no namespace "keda", não "fiapx".
  RABBITMQ_MANAGEMENT_URL: "http://guest:guest@rabbitmq.fiapx.svc.cluster.local:15672/%2F"
