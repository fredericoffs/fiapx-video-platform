# Placeholder — ver emenda AWS no ADR-012. Falta ingressClassName real (ex.: alb),
# host/TLS/cert-manager.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fiapx
  annotations:
    kubernetes.io/ingress.class: "REPLACE_ME" # ex.: alb
spec:
  rules:
    - host: REPLACE_ME.example.com
      http:
        paths:
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: video-gateway
                port:
                  number: 8080
          - path: /videos
            pathType: Prefix
            backend:
              service:
                name: video-gateway
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 8080
