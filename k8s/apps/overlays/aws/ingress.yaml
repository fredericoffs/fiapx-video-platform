apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: video-gateway
  annotations:
    kubernetes.io/ingress.class: "REPLACE_ME" # ex.: alb
spec:
  rules:
    - host: REPLACE_ME.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: video-gateway
                port:
                  number: 8080
