# Mesma separação de rotas do overlay local — via ingress-nginx (1 NLB só,
# ver k8s/addons/install-ingress-nginx.sh). Sem "host": ainda sem domínio, só o
# hostname do NLB. Convenção: API admin sempre em /admin/<recurso> (vai pro gateway);
# /admin exato é a página da SPA (cai em / → web). Prefixo mais longo vence no nginx.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fiapx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    # video-api aceita upload até 520MB (spring.servlet.multipart.max-request-size).
    nginx.ingress.kubernetes.io/proxy-body-size: "520m"
    # Download do zip processado pode passar de 1GB; sem isso o nginx corta a conexão
    # depois de 60s sem tráfego (default) e o navegador recebe "Failed to fetch".
    # Precisa acompanhar o idle timeout do Classic ELB (k8s/addons/install-ingress-nginx.sh).
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: video-gateway
                port:
                  number: 8080
          - path: /videos
            pathType: Prefix
            backend:
              service:
                name: video-gateway
                port:
                  number: 8080
          - path: /admin/users
            pathType: Prefix
            backend:
              service:
                name: video-gateway
                port:
                  number: 8080
          - path: /admin/videos
            pathType: Prefix
            backend:
              service:
                name: video-gateway
                port:
                  number: 8080
          - path: /users
            pathType: Prefix
            backend:
              service:
                name: video-gateway
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 8080
