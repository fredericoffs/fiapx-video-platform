# Sem secret.yaml aqui, diferente do overlay local: valores reais nunca ficam
# versionados — cd-aws.yml cria o Secret fiapx-secrets via kubectl a partir de
# GitHub Secrets. GATEWAY_CORS_ALLOWED_ORIGINS e o API_BASE_URL do web também não
# são patches estáticos: scripts/k8s-deploy-aws.sh descobre o hostname do ELB do
# ingress-nginx em runtime e propaga os dois.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fiapx

resources:
  - ../../base
  - ingress.yaml
