# Sem migration-job dedicado (ao contrário do video-api): Flyway do próprio app cria
# o schema "notification_worker" no startup (create-schemas: true).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-worker
  labels:
    app.kubernetes.io/name: notification-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notification-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notification-worker
    spec:
      containers:
        - name: notification-worker
          image: fiapx/notification-worker:local
          ports:
            - name: http
              containerPort: 8083
          envFrom:
            - configMapRef:
                name: fiapx-config
            # Secret próprio (item 20 da revisão crítica) — só as chaves que o
            # notification-worker usa (DB_USER, DB_PASSWORD, NOTIFICATION_WEBHOOK_URL).
            - secretRef:
                name: notification-worker-secrets
          # Boot do Spring sob CPU limitada é lento — sem startupProbe o livenessProbe mata
          # o container antes de terminar de subir. startupProbe/readinessProbe usam o grupo
          # readiness (inclui db), livenessProbe usa o grupo liveness (só o processo) — item
          # 16 da revisão crítica.
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
