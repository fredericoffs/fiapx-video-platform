# ClusterIP: exposição externa é via Ingress (k8s/apps/base/ingress.yaml), não este Service diretamente.
apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: web
  ports:
    - name: http
      port: 8080
      targetPort: 8080
