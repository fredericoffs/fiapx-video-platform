# ClusterIP-only: só video-gateway é exposto fora do cluster.
apiVersion: v1
kind: Service
metadata:
  name: video-api
  labels:
    app.kubernetes.io/name: video-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: video-api
  ports:
    - name: http
      port: 8081
      targetPort: 8081
