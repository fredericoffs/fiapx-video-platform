# Deixo ClusterIP-only, sem overlay que troque o tipo — não exponho o video-api fora do
# cluster (fecho assim a pendência da Sprint 2; só video-gateway é externo).
apiVersion: v1
kind: Service
metadata:
  name: video-api
  labels:
    app.kubernetes.io/name: video-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: video-api
  ports:
    - name: http
      port: 8081
      targetPort: 8081
