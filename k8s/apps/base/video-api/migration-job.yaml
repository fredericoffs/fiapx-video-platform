# Job dedicado de migração — roda as *.sql de video-api via CLI oficial do Flyway,
# sem subir o JAR do video-api só pra migrar. Nome fixo de propósito: .spec.template
# de um Job é imutável, os scripts de deploy fazem delete+apply, não só apply.
apiVersion: batch/v1
kind: Job
metadata:
  name: video-api-migrate
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: flyway
          image: flyway/flyway:10-alpine
          args:
            - migrate
          # DB_HOST/DB_PORT/DB_NAME/DB_SSLMODE vêm do ConfigMap (envFrom) — mesmo destino dos
          # serviços, seja o Postgres do cluster (local) ou o RDS (perfil aws).
          envFrom:
            - configMapRef:
                name: fiapx-config
          env:
            - name: FLYWAY_URL
              value: jdbc:postgresql://$(DB_HOST):$(DB_PORT)/$(DB_NAME)?sslmode=$(DB_SSLMODE)
            - name: FLYWAY_SCHEMAS
              value: video_api
            - name: FLYWAY_DEFAULT_SCHEMA
              value: video_api
            - name: FLYWAY_CREATE_SCHEMAS
              value: "true"
            - name: FLYWAY_LOCATIONS
              value: filesystem:/flyway/sql
            - name: FLYWAY_USER
              valueFrom:
                secretKeyRef:
                  name: fiapx-secrets
                  key: DB_USER
            - name: FLYWAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fiapx-secrets
                  key: DB_PASSWORD
          volumeMounts:
            - name: migrations
              mountPath: /flyway/sql
      volumes:
        - name: migrations
          configMap:
            name: video-api-migrations-sql
