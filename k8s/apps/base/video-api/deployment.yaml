apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-api
  labels:
    app.kubernetes.io/name: video-api
spec:
  # 1 réplica de repouso — é o HPA (hpa.yaml) quem escala sob carga.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: video-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: video-api
    spec:
      containers:
        - name: video-api
          image: fiapx/video-api:local
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: fiapx-config
            - secretRef:
                name: fiapx-secrets
          # Quem migra é o Job dedicado (migration-job.yaml) — o app só valida o schema.
          env:
            - name: SPRING_FLYWAY_ENABLED
              value: "false"
          # Boot do Spring sob CPU limitada do kind é lento — sem startupProbe o
          # livenessProbe mata o container antes de terminar de subir.
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
