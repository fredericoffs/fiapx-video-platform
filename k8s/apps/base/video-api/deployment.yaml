apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-api
  labels:
    app.kubernetes.io/name: video-api
spec:
  # 1 réplica de repouso — é o HPA (hpa.yaml) quem escala sob carga.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: video-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: video-api
    spec:
      containers:
        - name: video-api
          image: fiapx/video-api:local
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: fiapx-config
            - secretRef:
                name: fiapx-secrets
          # Quem migra é o Job dedicado (migration-job.yaml) — o app só valida o schema.
          env:
            - name: SPRING_FLYWAY_ENABLED
              value: "false"
          # Boot do Spring sob CPU limitada é lento — sem startupProbe o livenessProbe mata
          # o container antes de terminar de subir. startupProbe e readinessProbe apontam pro
          # grupo readiness (inclui db/redis, ver application.yml) — uma migration lenta ou o
          # RDS ainda não aceitando conexão legitimamente estende o startup. livenessProbe usa
          # o grupo liveness (só o processo) — item 16 da revisão crítica: sem essa separação,
          # uma indisponibilidade do RDS/Redis virava reinício repetido do pod em vez de só
          # sair da rotação de tráfego.
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
