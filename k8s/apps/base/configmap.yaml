# Superset de env vars compartilhado pelos 4 serviços — cada Deployment usa envFrom e
# ignora as chaves que não lê.
apiVersion: v1
kind: ConfigMap
metadata:
  name: fiapx-config
data:
  # postgres-postgresql/redis-master: nomes reais dos Services gerados pelo chart
  # Bitnami. rabbitmq/minio são nomes literais dos manifests próprios em k8s/infra/.
  DB_HOST: "postgres-postgresql"
  DB_PORT: "5432"
  DB_NAME: "fiapx"
  DB_SSLMODE: "disable"
  RABBITMQ_HOST: "rabbitmq"
  RABBITMQ_PORT: "5672"
  REDIS_HOST: "redis-master"
  REDIS_PORT: "6379"
  STORAGE_ENDPOINT: "http://minio:9000"
  STORAGE_BUCKET_RAW: "videos-raw"
  STORAGE_BUCKET_PROCESSED: "videos-processed"
  JWT_EXPIRATION_MINUTES: "30"
  LOGIN_RATE_LIMIT_MAX_ATTEMPTS: "5"
  LOGIN_RATE_LIMIT_WINDOW_SECONDS: "60"
  VIDEO_API_URI: "http://video-api:8081"
  GATEWAY_RATE_LIMIT_CAPACITY: "20"
  GATEWAY_RATE_LIMIT_PERIOD_SECONDS: "60"
  GATEWAY_CORS_ALLOWED_ORIGINS: "http://localhost:5173"
  QUEUE_STATUS_UPDATES: "video.status-updates"
  QUEUE_STATUS_UPDATES_DLX: "video.status-updates.dlx"
  QUEUE_STATUS_UPDATES_DLQ: "video.status-updates.dlq"
  QUEUE_NOTIFICATION: "video.notification"
  QUEUE_NOTIFICATION_DLX: "video.notification.dlx"
  QUEUE_NOTIFICATION_DLQ: "video.notification.dlq"
  QUEUE_PROCESSING: "video.processing"
  QUEUE_PROCESSING_DLX: "video.processing.dlx"
  QUEUE_PROCESSING_DLQ: "video.processing.dlq"
  FFMPEG_FPS: "1"
  FFMPEG_TIMEOUT_MINUTES: "15"
  FFMPEG_MAX_DURATION_SECONDS: "1800"
  FFMPEG_PROBE_TIMEOUT_SECONDS: "30"
  SMTP_HOST: "mailhog"
  SMTP_PORT: "1025"
  # Mailhog não roda no cluster — sem isso, o health indicator de mail do Actuator
  # tenta abrir SMTP de verdade e derruba a liveness do pod.
  MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
