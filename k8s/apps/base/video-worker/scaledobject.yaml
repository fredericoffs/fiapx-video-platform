# 2 triggers: profundidade da fila video.processing (principal) + CPU (complementar).
# Qualquer um acima do alvo dispara o scale-out.
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: rabbitmq-trigger-auth
spec:
  secretTargetRef:
    - parameter: host
      name: fiapx-secrets
      key: RABBITMQ_MANAGEMENT_URL
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: video-worker
spec:
  scaleTargetRef:
    name: video-worker
  minReplicaCount: 1
  maxReplicaCount: 3
  pollingInterval: 15
  cooldownPeriod: 60
  triggers:
    - type: rabbitmq
      metadata:
        queueName: video.processing
        mode: QueueLength
        value: "5"
        protocol: http
      authenticationRef:
        name: rabbitmq-trigger-auth
    # metricType é campo irmão de type/metadata, não chave dentro de metadata
    # (metadata.type é a forma antiga, removida nesta versão do KEDA).
    - type: cpu
      metricType: Utilization
      metadata:
        value: "70"
