# Só profundidade da fila fiapx-video-processing — nunca um gatilho de CPU aqui: ffmpeg é
# CPU-bound por natureza, então um único vídeo já satura o limite de CPU do próprio pod
# sem nenhum vídeo a mais na fila; um gatilho de CPU sobe réplicas ociosas competindo
# pela mesma capacidade de nó que o vídeo em processamento já está usando.
# Identidade do operador (LabRole do nó via IMDS) — sem IRSA. O valor de
# queueURL abaixo é o nome lógico da fila; scripts/k8s-deploy-aws.sh substitui pela URL SQS
# real (descoberta via aws CLI) depois do deploy.
# queueLength = 1 porque cada réplica processa exatamente uma mensagem por vez
# (maxMessages = 1 em SqsConsumersConfig) — a meta do KEDA tem que ser a capacidade real
# da réplica. Com 5, dois vídeos davam ceil(2/5) = 1 réplica e o segundo esperava na fila.
# A contagem inclui mensagens em voo (scaleOnInFlight, padrão true), então uma réplica
# processando não some por scale-down enquanto o vídeo dela ainda está na conta.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: video-worker
spec:
  scaleTargetRef:
    name: video-worker
  minReplicaCount: 1
  maxReplicaCount: 3
  pollingInterval: 15
  cooldownPeriod: 60
  # cooldownPeriod só vale para escalar até 0; a redução N -> minReplicaCount segue o HPA,
  # cuja janela padrão é 300s. 60s, uma réplica por vez, mantém a volta visível e gradual.
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 60
          policies:
            - type: Pods
              value: 1
              periodSeconds: 30
  triggers:
    - type: aws-sqs-queue
      metadata:
        queueURL: fiapx-video-processing
        queueLength: "1"
        awsRegion: us-east-1
        identityOwner: operator
