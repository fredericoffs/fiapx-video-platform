# Só profundidade da fila video.processing — nunca um gatilho de CPU aqui: ffmpeg é
# CPU-bound por natureza, então um único vídeo já satura o limite de CPU do próprio pod
# sem nenhum vídeo a mais na fila; um gatilho de CPU sobe réplicas ociosas competindo
# pela mesma capacidade de nó que o vídeo em processamento já está usando.
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: rabbitmq-trigger-auth
spec:
  secretTargetRef:
    - parameter: host
      name: fiapx-secrets
      key: RABBITMQ_MANAGEMENT_URL
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: video-worker
spec:
  scaleTargetRef:
    name: video-worker
  minReplicaCount: 1
  maxReplicaCount: 3
  pollingInterval: 15
  cooldownPeriod: 60
  triggers:
    - type: rabbitmq
      metadata:
        queueName: video.processing
        mode: QueueLength
        value: "5"
        protocol: http
      authenticationRef:
        name: rabbitmq-trigger-auth
