# Label "release: kube-prometheus-stack" precisa bater com o nome do Helm release: é o
# serviceMonitorSelectorNilUsesHelmValues (default do chart) que faz o Prometheus Operator
# descobrir este ServiceMonitor sem selector explícito.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: video-worker
  labels:
    app.kubernetes.io/name: video-worker
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: video-worker
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
