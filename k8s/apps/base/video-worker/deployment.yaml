# replicas aqui é só o valor inicial — quem controla a contagem é o KEDA ScaledObject
# (scaledobject.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-worker
  labels:
    app.kubernetes.io/name: video-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: video-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: video-worker
    spec:
      containers:
        - name: video-worker
          image: fiapx/video-worker:local
          ports:
            - name: http
              containerPort: 8082
          envFrom:
            - configMapRef:
                name: fiapx-config
            - secretRef:
                name: fiapx-secrets
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
            limits:
              cpu: 1500m
              memory: 768Mi
