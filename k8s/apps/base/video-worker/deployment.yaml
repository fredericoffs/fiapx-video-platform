# replicas aqui é só o valor inicial — quem controla a contagem é o KEDA ScaledObject
# (scaledobject.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-worker
  labels:
    app.kubernetes.io/name: video-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: video-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: video-worker
    spec:
      # Scale-down do KEDA e deploy mandam SIGTERM num pod que pode estar no meio do ffmpeg:
      # o consumer termina o vídeo em andamento (até 960s, SqsProperties.shutdownDrainSeconds)
      # antes de sair. Com o padrão de 30s o SIGKILL chegava antes e o vídeo era refeito do
      # zero em outro pod.
      terminationGracePeriodSeconds: 1020
      containers:
        - name: video-worker
          image: fiapx/video-worker:local
          ports:
            - name: http
              containerPort: 8082
          envFrom:
            # video-worker é stateless (ADR-008) — não usa JWT_SECRET, DB_USER/PASSWORD nem
            # ADMIN_SEED_PASSWORD; sem secretRef de propósito (item 20 da revisão crítica).
            - configMapRef:
                name: fiapx-config
          # startupProbe/readinessProbe usam o grupo readiness, livenessProbe usa o grupo
          # liveness (só o processo) — item 16 da revisão crítica.
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
          # ephemeral-storage (item 15 da revisão crítica): o diretório temporário de
          # ProcessVideoUseCase acumula, ao mesmo tempo, o vídeo bruto + todos os PNGs
          # extraídos + o zip final antes de limpar. Sem limite, um vídeo grande/longo podia
          # encher o disco do nó (30 GiB, node_disk_size_gb) e afetar outros pods ali. O teto
          # aqui é dimensionado pelos limites já existentes (upload até 500MB,
          # FFMPEG_MAX_DURATION_SECONDS=1800 a FFMPEG_FPS=1 → até 1800 frames), mas o tamanho
          # de cada PNG depende da resolução do vídeo (sem teto hoje) — é uma estimativa, não
          # uma garantia; vale confirmar com o maior vídeo realista antes de contar com ela.
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
              ephemeral-storage: 1Gi
            limits:
              cpu: 1500m
              memory: 768Mi
              ephemeral-storage: 8Gi
