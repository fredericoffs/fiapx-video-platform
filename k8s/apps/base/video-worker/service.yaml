# ClusterIP só para scrape do /actuator/prometheus — video-worker consome fila, não
# recebe tráfego HTTP de negócio.
apiVersion: v1
kind: Service
metadata:
  name: video-worker
  labels:
    app.kubernetes.io/name: video-worker
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: video-worker
  ports:
    - name: http
      port: 8082
      targetPort: 8082
