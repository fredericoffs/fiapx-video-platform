apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-gateway
  labels:
    app.kubernetes.io/name: video-gateway
spec:
  # Sem HPA aqui (só video-api tem HPA por CPU) — sobe manualmente se precisar.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: video-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: video-gateway
    spec:
      containers:
        - name: video-gateway
          image: fiapx/video-gateway:local
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: fiapx-config
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
