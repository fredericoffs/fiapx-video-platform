# Ver k8s/infra/rabbitmq/servicemonitor.yaml pro porquê do label "release".
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: video-gateway
  labels:
    app.kubernetes.io/name: video-gateway
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: video-gateway
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
