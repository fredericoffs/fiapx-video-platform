#-------------------------------------------------------------------------------#
#               Qodana analysis is configured by qodana.yaml file               #
#             https://www.jetbrains.com/help/qodana/qodana-yaml.html            #
#-------------------------------------------------------------------------------#

#################################################################################
#              WARNING: Do not store sensitive information in this file,        #
#               as its contents will be included in the Qodana report.          #
#################################################################################
version: "1.0"

#Specify inspection profile for code analysis
profile:
  base:
    name: qodana.starter
  # Sem override de JvmCoverageInspection desde 2026-09-29: cobertura é recurso do
  # linter pago, e o Community não lê o JaCoCo (o gate de 90% continua no ci.yml).

#Enable inspections
#include:
#  - name: <SomeEnabledInspectionId>

#Disable inspections
#exclude:
#  - name: <SomeDisabledInspectionId>

projectJDK: "21" #(Applied in CI/CD pipeline)

#Execute shell command before Qodana execution (Applied in CI/CD pipeline)
#bootstrap: sh ./prepare-qodana.sh

#Install IDE plugins before Qodana execution (Applied in CI/CD pipeline)
#plugins:
#  - id: <plugin.id> #(plugin id can be found at https://plugins.jetbrains.com)

# Quality gate. Will fail the CI/CD pipeline if any condition is not met
# severityThresholds - configures maximum thresholds for different problem severities
# testCoverageThresholds - configures minimum code coverage on a whole project and newly added code
# dependencyLicenses - fails the run on prohibited or unknown dependency licenses
# Code Coverage is available in Ultimate and Ultimate Plus plans
#
# Limiares definidos a partir de um baseline real (Sprint 3, tarefa 11, 2026-08-16):
# `qodana scan --image jetbrains/qodana-jvm-community:2026.2` sobre os 4 serviços
# (video-api, video-worker, notification-worker, video-gateway) com o perfil
# qodana.starter retornou 0 problemas. O gate abaixo trava em qualquer achado
# crítico e dá uma folga pequena para achados de menor severidade (o linter
# Ultimate usado no CI pode sinalizar um pouco mais que o Community usado no
# baseline local). testCoverageThresholds/dependencyLicenses seguem desativados
# — cobertura mínima já é tratada via JaCoCo na Sprint 3, tarefa 8.
#
# Recalibrado em 2026-08-21: até então o workflow do Qodana nunca rodava os testes antes
# do scan, então o JvmCoverageInspection nunca tinha dado nenhum problema — sem dado de
# cobertura, nada pra sinalizar. Ao corrigir isso (mvn test antes do scan, pra cobertura
# aparecer no relatório), essa inspeção passou a gerar 24 problemas, todos High. Duas
# correções reais (não só alargar o limiar): (1) o report do JaCoCo passou a excluir as
# mesmas classes que o gate de cobertura já excluía por decisão arquitetural
# (S3StorageClient, FfmpegFrameExtractor, ZipFileArchiver, *Application — ver pom.xml de
# cada serviço), derrubando 24→8; (2) a severidade da inspeção caiu pra WEAK WARNING (ver
# profile.inspections acima), que o Qodana bucketiza como Moderate, não High — pros 8 que
# sobram (gaps reais, não ruído de infraestrutura). `high` fica apertado (achado de
# verdade continua barrado com pouca folga); `moderate`/`any` acomodam os 8 conhecidos.
failureConditions:
  severityThresholds:
    critical: 0
    high: 3
    moderate: 15
    any: 20
#  testCoverageThresholds:
#    fresh: 70
#    total: 50
#  dependencyLicenses:
#    failOnProhibited: true
#    failOnUnknown: false

# Community (gratuito) desde 2026-09-29, quando a licença Ultimate venceu — o mesmo
# linter do baseline de 2026-08-16 acima.
#Specify Qodana linter for analysis (Applied in CI/CD pipeline)
linter: jetbrains/qodana-jvm-community:2026.2
