# Non-root: escuta em 8080 (não 80) e usa /tmp pros temp paths do nginx — evita
# precisar de chown em diretórios do sistema pra rodar como usuário "nginx".
pid /tmp/nginx.pid;
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Sem proxy: a SPA fala direto com o video-gateway via a URL de
    # /env-config.js (gerado em runtime pelo docker-entrypoint.sh) — este nginx
    # só serve os arquivos estáticos e faz fallback de rotas do client-side
    # router pro index.html.
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
