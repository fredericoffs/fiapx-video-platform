#-------------------------------------------------------------------------------#
#               Qodana analysis is configured by qodana.yaml file               #
#             https://www.jetbrains.com/help/qodana/qodana-yaml.html            #
#-------------------------------------------------------------------------------#

#################################################################################
#              WARNING: Do not store sensitive information in this file,        #
#               as its contents will be included in the Qodana report.          #
#################################################################################
version: '1.0'

#Specify inspection profile for code analysis
profile:
  base:
    name: qodana.starter
  # Deixo o JsCoverageInspection ativo (senão o resumo "Total coverage" some do relatório
  # — já vi isso acontecer). Tentei baixar de ERROR pra WARNING antes, mas não mudou
  # nada: pela tabela de mapeamento de severidade do Qodana (github.com/JetBrains/Qodana
  # lib_qd.topic#qodana-severity-levels), ERROR→Critical, WARNING→High, WEAK WARNING→
  # Moderate — o perfil qodana.starter já usa WARNING (High) como padrão pra essa
  # inspeção, então setar WARNING de novo era um no-op. WEAK WARNING é o primeiro nível
  # que realmente sai do bucket High. Os achados que sobram (callbacks de
  # onSuccess/onError dos formulários, alguns sub-componentes de card.tsx) considero gaps
  # reais de teste — vale escrever teste pra esses casos numa próxima passada — mas não
  # têm a mesma severidade de um bug de verdade.
  inspections:
    - inspection: JsCoverageInspection
      severity: 'WEAK WARNING'

# Uso uma config própria pro web/ (React/TypeScript) — linter diferente do JVM usado no
# resto do repo (../qodana.yaml), então preciso de um projeto/token separado no Qodana
# Cloud (secret QODANA_TOKEN_WEB no workflow .github/workflows/qodana_code_quality.yml).
#
# Recalibrei os limiares em 2026-08-21: já corrigi no código os 2 achados de "UMD global
# variable" (import de React faltando em skeleton.tsx/sonner.tsx); os 9 de cobertura
# viraram Moderate (não High) pela mudança de severidade acima. Deixo `high` apertado;
# `moderate`/`any` acomodam os 9 conhecidos.
failureConditions:
  severityThresholds:
    critical: 0
    high: 3
    moderate: 15
    any: 20
#  testCoverageThresholds:
#    fresh: 70
#    total: 50

#Specify Qodana linter for analysis (Applied in CI/CD pipeline)
linter: jetbrains/qodana-js:2026.2
