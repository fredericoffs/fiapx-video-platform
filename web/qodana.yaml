#-------------------------------------------------------------------------------#
#               Qodana analysis is configured by qodana.yaml file               #
#             https://www.jetbrains.com/help/qodana/qodana-yaml.html            #
#-------------------------------------------------------------------------------#

#################################################################################
#              WARNING: Do not store sensitive information in this file,        #
#               as its contents will be included in the Qodana report.          #
#################################################################################
version: '1.0'

#Specify inspection profile for code analysis
profile:
  name: qodana.starter

# Config próprio do web/ (React/TypeScript) — linter diferente do JVM usado no resto do
# repo (../qodana.yaml), então precisa de um projeto/token separado no Qodana Cloud
# (secret QODANA_TOKEN_WEB no workflow .github/workflows/qodana_code_quality.yml).
#
# Limiares calibrados contra o primeiro scan real (2026-08-21), 11 problemas: 9 High do
# JsCoverageInspection (sinaliza método a método quem está abaixo de 50% de cobertura —
# não é bug, é o próprio sinal de cobertura funcionando; cobertura de verdade é tratada
# pelo vitest/v8 em lcov, ferramenta de referência aqui) + 2 Moderate de "UMD global
# variable" (import de React faltando em skeleton.tsx/sonner.tsx, corrigidos no código).
# Chegou a existir um `exclude: JsCoverageInspection` aqui, mas isso também apagava o
# resumo "Total coverage" do relatório — voltou a ser o problema original (Qodana sem
# mostrar cobertura nenhuma). `high`/`any` abaixo têm folga sobre os 9 conhecidos.
failureConditions:
  severityThresholds:
    critical: 0
    high: 15
    any: 20
#  testCoverageThresholds:
#    fresh: 70
#    total: 50

#Specify Qodana linter for analysis (Applied in CI/CD pipeline)
linter: jetbrains/qodana-js:2026.2
