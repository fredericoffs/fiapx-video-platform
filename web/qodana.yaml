#-------------------------------------------------------------------------------#
#               Qodana analysis is configured by qodana.yaml file               #
#             https://www.jetbrains.com/help/qodana/qodana-yaml.html            #
#-------------------------------------------------------------------------------#

#################################################################################
#              WARNING: Do not store sensitive information in this file,        #
#               as its contents will be included in the Qodana report.          #
#################################################################################
version: '1.0'

#Specify inspection profile for code analysis
profile:
  name: qodana.starter

# Config próprio do web/ (React/TypeScript) — linter diferente do JVM usado no resto do
# repo (../qodana.yaml), então precisa de um projeto/token separado no Qodana Cloud
# (secret QODANA_TOKEN_WEB no workflow .github/workflows/qodana_code_quality.yml).
failureConditions:
  severityThresholds:
    critical: 0
    any: 10
#  testCoverageThresholds:
#    fresh: 70
#    total: 50

#Specify Qodana linter for analysis (Applied in CI/CD pipeline)
linter: jetbrains/qodana-js:2026.2
