#-------------------------------------------------------------------------------#
#               Qodana analysis is configured by qodana.yaml file               #
#             https://www.jetbrains.com/help/qodana/qodana-yaml.html            #
#-------------------------------------------------------------------------------#

#################################################################################
#              WARNING: Do not store sensitive information in this file,        #
#               as its contents will be included in the Qodana report.          #
#################################################################################
version: '1.0'

#Specify inspection profile for code analysis
profile:
  base:
    name: qodana.starter
  # JsCoverageInspection continua ativa (senão o resumo "Total coverage" some do
  # relatório — já vimos isso acontecer), só baixa de ERROR pra WARNING: um método com
  # menos de 50% de cobertura (callbacks de onSuccess/onError dos formulários, alguns
  # sub-componentes de card.tsx) é um sinal real de gap de teste, mas não é "severidade
  # alta" no mesmo sentido que um bug — vale escrever teste pra esses casos numa
  # próxima passada, não é ruído a esconder.
  inspections:
    - inspection: JsCoverageInspection
      severity: WARNING

# Config próprio do web/ (React/TypeScript) — linter diferente do JVM usado no resto do
# repo (../qodana.yaml), então precisa de um projeto/token separado no Qodana Cloud
# (secret QODANA_TOKEN_WEB no workflow .github/workflows/qodana_code_quality.yml).
#
# Limiares recalibrados em 2026-08-21 depois de rebaixar a severidade do
# JsCoverageInspection acima: os 2 achados de "UMD global variable" (import de React
# faltando em skeleton.tsx/sonner.tsx) já foram corrigidos no código, e os 9 de cobertura
# não contam mais como High. `high`/`any` ficam com uma folga pequena, não uma folga larga.
failureConditions:
  severityThresholds:
    critical: 0
    high: 3
    any: 15
#  testCoverageThresholds:
#    fresh: 70
#    total: 50

#Specify Qodana linter for analysis (Applied in CI/CD pipeline)
linter: jetbrains/qodana-js:2026.2
